[project]
name = "nms-exporter"
version = "0.1.0"
description = "No Man's Sky save exporter, wall screens and live map"
requires-python = ">=3.12"
# psycopg for nms-db (nmsexporter/db.py); everything else is the standard library.
# binary: bundles libpq, so nothing needs installing from apt.
dependencies = ["psycopg[binary]>=3.2,<4"]

[tool.uv]
package = false
