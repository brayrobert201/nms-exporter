<!doctype html>
<html lang="en" data-posture="none">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0A0A10">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>NMS</title>
<!--
  The phone page: Map, Farms, Inventory and Build, one tab at a time, from /api/map, /json and
  /api/live. The Android app (android/) is this page in a WebView with the screen kept on; in a
  phone browser it is the same page, so the two never drift apart. Built from the Claude Design
  prototype "NMS Mobile" (tokens: Refined Midnight). The save is an anchor, not a feed: every fill
  and timer ticks forward from the save's age, and the save age is always on screen.
-->
<style>
@font-face { font-family: 'Geist'; src: url('/fonts/Geist.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
@font-face { font-family: 'Geist Mono'; src: url('/fonts/GeistMono.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
@font-face { font-family: 'NMS Glyphs'; src: url('/fonts/NMS-Glyphs-Mono.ttf') format('truetype'); font-display: swap; }
:root {
  --bg: #0A0A10; --bg-elev: #0F0F16; --surface: #14141D; --surface-2: #1A1A25; --surface-3: #22222F;
  --glass: rgba(255,255,255,0.035); --glass-strong: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.08); --glass-border-strong: rgba(255,255,255,0.14); --line: rgba(255,255,255,0.06);
  --text: #F2F2F5; --text-dim: #C9C9D2; --muted: #8B8B9E; --dim: #55556A; --disabled: #3A3A4A;
  --brand: #7B6CFF; --brand-hover: #8F82FF; --brand-glow: rgba(123,108,255,0.28); --brand-tint: rgba(123,108,255,0.12);
  --svc-movement: #5B8CFF; --svc-strength: #FF5F6D; --svc-squash: #FFC93C;
  --success: #1FD9A3; --success-tint: rgba(31,217,163,0.12); --warn: #FFA94D; --warn-tint: rgba(255,169,77,0.14);
  --danger: #FF5C5C; --danger-tint: rgba(255,92,92,0.12); --info: #5B8CFF; --info-tint: rgba(91,140,255,0.14);
  --tier-5: #FFC070;
  --r-pill: 999px; --shadow-3: 0 12px 40px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.4);
  --font-sans: 'Geist', 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --fold-gap: 16px;
  /* a browser pads for the system bars here; the Android app already pads its WebView, so it zeroes these */
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
html.app { --safe-top: 0px; --safe-bottom: 0px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
  line-height: 1.45; letter-spacing: -0.003em; overscroll-behavior: none; }
body { display: flex; flex-direction: column; height: 100dvh; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
input { font: inherit; color: inherit; }
input::placeholder { color: var(--dim); }
.nms-scroll { scrollbar-width: none; } .nms-scroll::-webkit-scrollbar { display: none; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---- shell: header, content, nav ---- */
.tab { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#page { overflow-y: auto; padding-bottom: 20px; }
#page > * { flex: none; }     /* a flex column would squeeze tall blocks; every block keeps its height */
.hdr { flex: none; padding: calc(8px + var(--safe-top)) 20px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.hdr .row { display: flex; justify-content: space-between; align-items: center; gap: 6px 8px; min-height: 22px; flex-wrap: wrap; }
.hdr .row > .eyebrow, .hdr .row > .back { flex: 1 1 auto; min-width: 0; }
.hdr .row.base { align-items: baseline; gap: 10px; }
.hdr h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hdr h1 button { font: inherit; letter-spacing: inherit; text-align: left; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hdr h1 button::after { content: " ▾"; color: var(--dim); font-size: 14px; }
.hdr .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
.eyebrow { font: 600 10px var(--font-mono); color: var(--dim); letter-spacing: .12em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { font-size: 12px; font-weight: 600; color: var(--brand); display: flex; align-items: center; gap: 4px; padding: 4px 0; white-space: nowrap; }
.pills { display: flex; gap: 6px; flex: none; margin-left: auto; max-width: 100%; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: var(--r-pill); font: 600 10px var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  background: var(--glass-strong); color: var(--text-dim); }
.pill.ok { background: var(--success-tint); color: var(--success); }
.pill.warn { background: var(--warn-tint); color: var(--warn); }
.pill.bad { background: var(--danger-tint); color: var(--danger); }
.pill.off { color: var(--muted); }
.hdr .row.glyphrow { flex-wrap: nowrap; justify-content: flex-start; }
.glyphrow { display: flex; align-items: center; gap: 10px; }
.glyphs { font-family: 'NMS Glyphs', var(--font-mono); font-size: 19px; letter-spacing: 1px; line-height: 1; }
.glyphcode { font: 500 10.5px var(--font-mono); color: var(--muted); }

nav { flex: none; display: flex; justify-content: space-around; padding: 10px 0 calc(14px + var(--safe-bottom)); border-top: 1px solid var(--line);
  background: rgba(10,10,16,.95); backdrop-filter: blur(12px); }
nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; font-size: 9.5px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
nav button.on { color: var(--brand); }
nav button span { display: flex; align-items: center; gap: 4px; }
nav .badge { min-width: 14px; height: 14px; padding: 0 4px; border-radius: 7px; background: var(--warn); color: #1A0E00; font: 700 9px/14px var(--font-mono); }
nav .badge.bad { background: var(--danger); color: #fff; }
nav svg { width: 22px; height: 22px; }

/* ---- map ---- */
.mapwrap { flex: 1; position: relative; min-height: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 42%, #14141D 0%, #0A0A10 72%); touch-action: none; }
#svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#svg text { font-family: var(--font-sans); pointer-events: none; paint-order: stroke; stroke-linejoin: round; }
.north { position: absolute; left: 14px; bottom: 60px; display: flex; flex-direction: column; align-items: center; color: var(--text-dim); font: 500 11px var(--font-mono); pointer-events: none; opacity: .8; }
.glass { background: rgba(20,20,29,.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--glass-border); }
.ctl { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
.ctl button { width: 40px; height: 40px; border-radius: 12px; font-size: 20px; color: var(--text); display: flex; align-items: center; justify-content: center; }
.ctl button.fit { font: 600 10px var(--font-mono); color: var(--text-dim); }
.ctl button.on { color: var(--brand); border-color: var(--brand); }
.ctl button:disabled { color: var(--dim); }
.issue { position: absolute; left: 12px; top: 12px; max-width: calc(100% - 76px); display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 8px; border-radius: var(--r-pill);
  border: 1px solid rgba(255,92,92,.35); font-size: 12px; color: var(--text-dim); text-align: left; }
.issue span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { padding: 2px 8px; border-radius: var(--r-pill); font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; flex: none; }
.tag.bad { background: var(--danger-tint); color: var(--danger); }
.tag.warn { background: var(--warn-tint); color: var(--warn); }
.tag.ok { background: var(--success-tint); color: var(--success); }
.tag.off { background: var(--glass-strong); color: var(--muted); }
.away { position: absolute; left: 12px; right: 64px; top: 12px; padding: 8px 12px; border-radius: 14px; font-size: 12px; color: var(--text-dim); display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.away.down { top: 56px; }
.away b { color: var(--text); font-weight: 600; }
.away button { color: var(--brand); font-weight: 600; font-size: 12px; padding: 4px 6px; }
.goto { position: absolute; left: 12px; right: 64px; bottom: 60px; padding: 8px 10px; border-radius: 14px; display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; color: var(--text); font-size: 13px; }
.goto b { font-size: 16px; font-weight: 600; font-family: var(--font-mono); }
.goto small { display: block; color: var(--muted); font-size: 11px; }
.goto svg { width: 28px; height: 28px; color: var(--text); }
.goto button { width: 30px; height: 30px; border-radius: 50%; background: var(--glass-strong); color: var(--muted); font-size: 15px; }
.legend { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; gap: 6px; overflow-x: auto; padding: 0 12px; }
.legend button { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: var(--r-pill); font-size: 11px; font-weight: 600; color: var(--text-dim); }
.legend button.off { color: var(--dim); text-decoration: line-through; }
.legend button.off i { opacity: .3; }
.legend button i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.legend button i.line { height: 2px; border-radius: 1px; }
.legend button.live { color: var(--text); border-color: var(--glass-border-strong); }
.selsheet { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--surface); border: 1px solid var(--glass-border); border-radius: 20px; padding: 10px 16px 16px;
  box-shadow: var(--shadow-3); display: flex; flex-direction: column; gap: 10px; max-height: 60%; overflow-y: auto; }
.handle { width: 36px; height: 4px; border-radius: 2px; background: var(--glass-border-strong); align-self: center; flex: none; }
.selhead { display: flex; align-items: flex-start; gap: 10px; }
.selhead i { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
.selhead .t { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.selhead .k { font-size: 11px; color: var(--muted); }
.xbtn { width: 32px; height: 32px; border-radius: 50%; background: var(--glass-strong); color: var(--muted); font-size: 16px; flex: none; display: flex; align-items: center; justify-content: center; }
.lines { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--text-dim); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.actions { display: flex; gap: 8px; }
.actions button { flex: 1; padding: 11px 14px; border-radius: var(--r-pill); font-size: 13px; font-weight: 600; border: 1px solid var(--glass-border); color: var(--text-dim); }
.actions button.pri { background: var(--brand); color: #fff; border-color: var(--brand); }

/* ---- lists and cards (farms, inventory, build) ---- */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 14px 16px 6px; }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0 14px 6px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.tile .l { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
.tile .v { font: 600 20px var(--font-mono); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v.bad { color: var(--danger); }
.tile .v.sm { font-size: 18px; }
.tile .n { font-size: 11px; color: var(--muted); }
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 8px 16px 12px; }
.cards.tight { padding: 0 14px; }
.card { text-align: left; display: flex; flex-direction: column; gap: 9px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; width: 100%; }
.card .name { font-size: 15px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card .sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.state { flex: none; padding: 3px 9px; border-radius: var(--r-pill); font-size: 10.5px; font-weight: 600; white-space: nowrap; color: var(--text-dim); background: var(--glass-strong); }
.state.full { color: var(--warn); background: var(--warn-tint); }
.bar { height: 6px; width: 100%; background: var(--glass-strong); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
.bar.thin { height: 4px; } .bar.thin i { border-radius: 2px; }
.bar i.bad { background: var(--danger); }
.card .foot { display: flex; justify-content: space-between; width: 100%; font-size: 11px; color: var(--muted); gap: 8px; }
.card .foot .mono { color: var(--text-dim); }
.hero { margin: 14px 14px 10px; padding: 18px; border-radius: 16px; background: linear-gradient(145deg, rgba(123,108,255,.16), rgba(91,140,255,.06)); border: 1px solid rgba(123,108,255,.28); display: flex; flex-direction: column; gap: 10px; }
.hero .row { display: flex; justify-content: space-between; align-items: center; }
.hero .big { display: flex; align-items: baseline; gap: 10px; }
.hero .pct { font: 600 40px/1 var(--font-mono); letter-spacing: -.03em; }
.hero .of { font: 500 13px var(--font-mono); color: var(--text-dim); }
.hero .bar { height: 10px; background: rgba(255,255,255,.08); border-radius: 5px; } .hero .bar i { box-shadow: 0 0 12px var(--brand-glow); border-radius: 5px; }
.sect { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; padding: 16px 18px 8px; display: flex; justify-content: space-between; gap: 8px; }
.sect span:last-child { text-transform: none; letter-spacing: 0; font-weight: 400; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 0 14px; }
.list .r { width: 100%; text-align: left; display: grid; grid-template-columns: 10px minmax(0, 1fr) 96px; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.list .r:last-child { border-bottom: 0; }
.list .r i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.list .r .n { font-size: 13px; font-weight: 600; }
.list .r .w { font-size: 11px; color: var(--muted); }
.list .r .p { font-size: 10px; font-weight: 700; color: var(--danger); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
.list .r .f { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; font: 500 11.5px var(--font-mono); color: var(--text-dim); white-space: nowrap; text-align: right; }
.list .r .f .q { font: 400 10.5px var(--font-sans); color: var(--dim); white-space: normal; line-height: 1.2; }
.pcard { margin: 10px 14px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.pcard .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pcard .why { font-size: 12px; color: var(--muted); text-wrap: pretty; }
.pcard .kv { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 12px; }
.pcard .kv span:first-child { color: var(--muted); } .pcard .kv span:last-child { font-family: var(--font-mono); text-align: right; }
.cta { margin: 12px 14px 20px; }
.cta button { width: 100%; padding: 13px; border-radius: var(--r-pill); background: var(--brand); color: #fff; font-size: 14px; font-weight: 700; }
.note { font-size: 12px; color: var(--muted); text-align: center; padding: 8px 14px 20px; text-wrap: pretty; }
.search { margin-top: 8px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; height: 44px; border-radius: 12px; background: var(--surface); border: 1px solid var(--glass-border); }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-size: 14px; }
.chips { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.chips.pad { padding: 0 14px 8px; margin: 0; }
.chips button { padding: 5px 11px; border-radius: var(--r-pill); font-size: 11px; font-weight: 600; display: flex; gap: 5px; color: var(--muted); border: 1px solid var(--glass-border); }
.chips button.on { color: var(--text); background: var(--glass-strong); border-color: var(--glass-border-strong); }
.chips button span { font-family: var(--font-mono); opacity: .6; }
.rowcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
.rowcard > button { width: 100%; text-align: left; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 12px; min-height: 52px; }
.rowcard .chev { color: var(--dim); font-size: 10px; }
.rowcard .n { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowcard .s { font-size: 11px; color: var(--muted); }
.rowcard .tot { font: 600 15px var(--font-mono); font-variant-numeric: tabular-nums; }
.rowcard .body { padding: 2px 12px 12px 34px; display: flex; flex-direction: column; gap: 8px; }
.place { display: flex; flex-direction: column; gap: 4px; }
.place .l { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-dim); }
.place .l span:last-child { font-family: var(--font-mono); color: var(--text); }
.place .l small { color: var(--dim); }
.ing { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-dim); }
.ing span:last-child { font-family: var(--font-mono); }
.ing small { color: var(--dim); }
.bp { padding: 14px; border-radius: 14px; background: linear-gradient(145deg, rgba(123,108,255,.14), rgba(91,140,255,.05)); border: 1px solid rgba(123,108,255,.28); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bp .h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bp .h .t { font-size: 15px; font-weight: 600; } .bp .h .t small { font-size: 11px; color: var(--muted); font-weight: 400; }
.bp .h .v { font-size: 11px; font-weight: 600; white-space: nowrap; }
.bp .g { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.bp .g .nm { font-size: 13px; font-weight: 600; } .bp .g .nm span { font-family: var(--font-mono); font-weight: 500; color: var(--text-dim); }
.bp .g .wh { font-size: 11px; color: var(--muted); grid-column: 1 / -1; }
.plan .nums { display: flex; gap: 24px; }
.plan .nums .l { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
.plan .nums .v { font: 600 24px/1.1 var(--font-mono); } .plan .nums .v.ok { color: var(--success); }
.plan .blk { font-size: 12px; color: var(--warn); }
.ok { color: var(--success); } .warn { color: var(--warn); } .bad { color: var(--danger); }
.almost { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.almost .h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.almost .h .t { font-size: 14px; font-weight: 600; } .almost .h .t small { font-size: 11px; font-weight: 400; color: var(--muted); }
.almost .h .c { font-size: 11px; color: var(--muted); white-space: nowrap; }
.almost .l { font-size: 12px; color: var(--text-dim); text-wrap: pretty; }
.empty { padding: 28px 8px; text-align: center; font-size: 13px; color: var(--muted); }
button.bp { width: 100%; }
.lvbtn { align-self: flex-start; color: var(--brand); font-size: 12px; font-weight: 600; padding: 4px 0; }
.lnk { color: var(--text); text-decoration: underline; text-decoration-color: var(--glass-border-strong); text-underline-offset: 3px; font-size: inherit; }
.qty { display: flex; align-items: center; gap: 6px; padding: 12px 16px 0; flex-wrap: wrap; }
.qty .lbl { flex: 1 1 100%; font-size: 12px; color: var(--muted); }
.qty .step { width: 36px; height: 36px; border-radius: 10px; background: var(--surface); border: 1px solid var(--glass-border); font-size: 18px; }
.qty .n { font: 600 20px var(--font-mono); min-width: 44px; text-align: center; }
.qty .chips { margin: 0 0 0 auto; flex-wrap: nowrap; }
.qty .chips button { padding: 5px 10px; }
.tree { margin: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tn { width: 100%; text-align: left; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); min-height: 48px; }
.tn:last-child { border-bottom: 0; }
.tn .chev { color: var(--dim); font-size: 10px; text-align: center; }
.tn .nm { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

// ---- Build breakdown (/api/craft): the build order, bottom up, and every level as a tree, stock first ----
const CRAFT = { key: null, data: null, err: null, seq: 0 };

const craftSpec = () => S.craft.map(([i, n]) => `${i}:${n}`).join(',');
async function loadCraft() {
  const key = `${craftSpec()}|${jsonAt}`;
  if (CRAFT.key === key) return;
  CRAFT.key = key; CRAFT.err = null; const seq = ++CRAFT.seq;
  try {
    const r = await fetch(`/api/craft?items=${encodeURIComponent(craftSpec())}`, { cache: 'no-store' });
    const d = await r.json();
    if (seq !== CRAFT.seq) return;
    if (d.error) { CRAFT.err = d.error; CRAFT.data = null; } else { d.spec = craftSpec(); CRAFT.data = d; }
  } catch (e) { if (seq !== CRAFT.seq) return; CRAFT.err = String(e.message || e); CRAFT.data = null; }
  if (S.tab === 'build' && S.craft) renderCraft();
}
const needsText = (m) => m.needs.map((x) => `${fnum(x.amount)} ${esc(x.item)}`).join(' + ');
function renderCraft() {
  const P = $('page'), d = CRAFT.data && CRAFT.data.spec === craftSpec() ? CRAFT.data : null;

  const title = names.join(' + ');
  const qty = S.craft.map(([id, n], i) => { const t = d && d.targets[i], mx = t && t.max;
    return `<div class="qty"><span class="lbl">${esc(t ? t.item : id)}${mx != null ? ` · most from stock now ${mx >= 999999 ? '1M+' : fnum(mx)}` : ''}</span>`
      + `<button class="step" data-act="craftn" data-i="${i}" data-d="-1" aria-label="One fewer">−</button><span class="n">${fnum(n)}</span><button class="step" data-act="craftn" data-i="${i}" data-d="1" aria-label="One more">+</button>`
      + `<div class="chips">${[1, 5].map((k) => `<button class="${n === k ? 'on' : ''}" data-act="craftn" data-i="${i}" data-n="${k}">×${k}</button>`).join('')}${mx > 0 && mx < 10000 ? `<button class="${n === mx ? 'on' : ''}" data-act="craftn" data-i="${i}" data-n="${mx}">max ${fnum(mx)}</button>` : ''}</div></div>`; }).join('');
  let body;
  if (CRAFT.err) body = `<div class="empty">${esc(CRAFT.err)}</div>`;

  else {
    const all = d.steps.flatMap((st) => st.items), count = (r) => all.filter((m) => m.route === r).reduce((a, m) => a + m.crafts, 0);
    const work = [['craft', 'craft'], ['refine', 'refiner op'], ['cook', 'cook']].map(([r, w]) => count(r) && plural(count(r), w)).filter(Boolean).join(' · ');
    const verdict = d.ok ? `<span class="v ok">You can make ${d.targets.length > 1 || d.targets[0].qty > 1 ? 'these' : 'this'}</span>` : `<span class="v warn">Short of ${plural(d.short.length, 'material')}</span>`;
    body = `<div class="cards tight" style="padding-top:12px"><div class="bp"><div class="h"><span class="t">${d.targets.map((t) => `${fnum(t.qty)} × ${esc(t.item)}`).join(' + ')}</span>${verdict}</div>`
      + `<div style="font-size:12px;color:var(--muted)">${plural(d.steps.length, 'step')} · ${work || 'nothing to make'}</div>`
      + d.short.map((x) => `<div class="g"><span class="nm">${esc(x.item)}</span><span class="tag warn" style="justify-self:end">Short ${fnum(x.amount)}</span><span class="wh">have ${fnum(x.have)} · nothing in stock makes the rest</span></div>`).join('')
      + `</div></div>`
      + `<div class="chips pad" style="padding-top:14px"><button class="${S.cview === 'order' ? 'on' : ''}" data-act="cview" data-v="order">Build order</button><button class="${S.cview === 'tree' ? 'on' : ''}" data-act="cview" data-v="tree">Every level</button></div>`;
    if (S.cview === 'tree') body += `<div class="sect" style="padding-top:6px"><span>Every level</span><span>tap to fold · stock first</span></div><div class="tree" id="tree"></div>`;
    else body += d.steps.map((st, i) => `<div class="sect" style="padding-top:${i ? 16 : 6}px"><span>Step ${st.step}${i === 0 ? ' · from raw materials' : i === d.steps.length - 1 ? ' · the build' : ''}</span><span>${plural(st.items.length, 'item')}</span></div>`
      + `<div class="tree">${st.items.map((m) => `<div class="tn step${m.target ? ' tgt' : ''}"><span class="q">${fnum(m.make)}</span><div style="min-width:0"><div class="nm">${esc(m.item)}</div>`
        + `<div class="how"><b>${ROUTE[m.route] || m.route}</b>${m.route !== 'craft' ? ` · ${esc(m.recipe)}` : ''} ×${fnum(m.crafts)} · ${needsText(m)}${m.crafts > 1 ? ' each' : ''}${m.yield > 1 ? ` · makes ${m.yield}` : ''}</div>`
        + `${m.from_stock ? `<div class="how">uses ${fnum(m.from_stock)} you hold first, of ${fnum(m.have)}</div>` : ''}</div></div>`).join('')}</div>`).join('');
    body += `<div class="sect"><span>Raw materials used</span><span>of what you hold</span></div><div class="cards tight" style="padding-bottom:14px"><div class="rowcard" style="padding:6px 12px">`
      + d.raw.map((x) => `<div class="ing" style="padding:5px 0;border-bottom:1px solid var(--line)"><span>${esc(x.item)}</span><span>${fnum(x.amount)} <small>of ${fnum(x.have)}</small></span></div>`).join('') + `</div></div>`;
  }
  P.innerHTML = `<header class="hdr"><div class="row"><button class="back" data-act="craftback">‹ Build</button><span class="pills">${pillSave()}</span></div><h1 style="white-space:normal">${esc(title)}</h1><div class="sub" style="white-space:normal">Bottom up from raw materials, net of what you hold; an ingredient used twice is counted once</div></header>`
    + qty + body;
  if (d && S.cview === 'tree') drawTree();
}
function drawTree() {
  const T = $('tree'), d = CRAFT.data; if (!T || !d) return;
  const rows = [];
  function walk(n, depth, path) {
    const kids = n.children.length > 0, open = kids && !S.closed.has(path);
    let how, amt;
    if (n.short) { how = `have ${fnum(n.have)}${n.from_stock ? ` · ${fnum(n.from_stock)} from stock` : ''}`; amt = `<span class="amt short">${fnum(n.short)}<small>short</small></span>`; }
    else if (n.make) { how = `<b>${ROUTE[n.route] || n.route}</b>${n.route !== 'craft' ? ` · ${esc(n.recipe)}` : ''} ×${fnum(n.crafts)}${n.yield > 1 ? ` · makes ${n.yield} each` : ''}${n.from_stock ? ` · ${fnum(n.from_stock)} from stock` : ''}`;
      amt = `<span class="amt make">${fnum(n.make)}<small>make</small></span>`; }
    else { how = `from stock · have ${fnum(n.have)}`; amt = `<span class="amt stock">${fnum(n.from_stock)}<small>stock</small></span>`; }
    // one faint guide per ancestor level, so siblings deep in the tree still line up with their parent
    const guides = Array.from({ length: depth }, (_, i) => `linear-gradient(var(--glass-border-strong), var(--glass-border-strong)) ${17 + i * 16}px 0 / 1px 100% no-repeat`).join(', ');
    rows.push(`<button class="tn d${depth}" ${kids ? `data-act="node" data-path="${path}"` : 'tabindex="-1"'} style="padding-left:${12 + depth * 16}px;${kids ? '' : 'cursor:default;'}${guides ? `background:${guides};` : ''}">`
      + `<span class="chev">${kids ? (open ? '▾' : '▸') : ''}</span><div style="min-width:0"><div class="nm"><span class="lv">L${depth}</span>${esc(n.item)}<small>×${fnum(n.need)}</small></div><div class="how">${how}</div></div>${amt}</button>`);
    if (open) n.children.forEach((c, i) => walk(c, depth + 1, `${path}.${i}`));
  }
  d.trees.forEach((t, i) => walk(t, 0, String(i)));
  T.innerHTML = rows.join('');
}

function nearbySheet() {
  const rows = (LIVE.nearby || []).map((r) => { const isBase = r.kind === 'base', lab = isBase ? r.base : `${LABEL[r.kind] || r.kind} · ${r.base}`;
    return `<button class="srow ${S.target && S.target.key === r.key ? 'on' : ''}" data-act="target" data-key="${esc(r.key)}" data-label="${esc(lab)}">${arrow(r.turn)}<div style="min-width:0"><div class="n">${esc(isBase ? r.base : LABEL[r.kind] || r.kind)}</div><div class="s">${isBase ? 'Base' : esc(r.base)}</div></div><span class="d">${fdist(r.dist)}<small>${height(r.h)}</small></span></button>`; });
  const far = (LIVE.bases || []).filter((b) => !(LIVE.nearby || []).some((n) => n.key === b.key));
  openSheet('Nearby', LIVE.state === 'live' ? 'arrows are relative to your facing' : 'stale', rows.join('') + (far.length ? `<div class="sect" style="padding:10px 8px 4px"><span>Other bases here</span></div>` + far.map((r) => `<button class="srow" data-act="target" data-key="${esc(r.key)}" data-label="${esc(r.base)}">${arrow(r.turn)}<div style="min-width:0"><div class="n">${esc(r.base)}</div><div class="s">Base</div></div><span class="d">${fdist(r.dist)}</span></button>`).join('') : ''));
}
let toastT = null;
function toast(text) { const T = $('toast'); T.textContent = text; T.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { T.hidden = true; }, 2200); }

// ---- actions (every tappable thing carries data-act) ----
const ACT = {
  tab: (d) => { if (d.tab === 'app') { SHELL && SHELL.openSettings(); return; } go({ tab: d.tab, farm: d.tab === 'farms' ? null : S.farm }); },
  planets: () => planetsSheet(),
  openplanet: (d) => { closeSheet(); go({ tab: 'map', planet: d.planet, level: 'planet', base: null }); },
  planet: () => go({ level: 'planet', base: null }),
  openbase: (d) => go({ tab: 'map', planet: d.planet || S.planet, level: 'base', base: d.base }),
  farms: () => go({ tab: 'farms', farm: null }),
  farm: (d) => go({ tab: 'farms', farm: d.farm }),
  locate: (d) => { const lo = layoutOf(d.base); if (!lo) return; go({ tab: 'map', planet: lo.planet.address, level: 'base', base: d.base }); const it = lo.lay.items.find((i) => i.i === +d.i); if (it) { S.sel = `o:${it.i}`; zoomTo(it.e, -it.n, 60); } },
  issue: (d, a) => { if (a.dataset.base) { go({ level: 'base', base: a.dataset.base }); const lay = layout(), bad = lay && lay.items.find((i) => i.problems); if (bad) { S.sel = `o:${bad.i}`; zoomTo(bad.e, -bad.n, 60); } }
    else if (a.dataset.i !== '') { const lay = layout(), it = lay && lay.items.find((i) => i.i === +a.dataset.i); if (it) { S.sel = `o:${it.i}`; zoomTo(it.e, -it.n, 60); } } },
  zoom: (d) => { S.follow = false; zoomAt(+d.k); $('findme').classList.remove('on'); },
  fit: () => { S.follow = false; $('findme').classList.remove('on'); fitAll(); },
  findme: () => { if (!me()) return; S.follow = !S.follow; $('findme').classList.toggle('on', S.follow); if (S.follow) centreOnMe(); },
  showme: () => showMe(),
  kind: (d) => { if (S.hidden.has(d.kind)) S.hidden.delete(d.kind); else S.hidden.add(d.kind); drawMap(); drawLegend(); },
  closesel: () => { S.sel = null; drawMap(); drawSel(); drawIssue(); },
  target: (d) => { closeSheet(); if (S.target && S.target.key === d.key) { S.target = null; toast('Navigation stopped'); } else { S.target = { key: d.key, label: d.label || (S.target && S.target.label) || '' }; toast(`Navigating to ${S.target.label}`); }
    S.sel = null; drawSel(); drawIssue(); pollLive(true); },
  nearby: () => nearbySheet(),
  closesheet: () => closeSheet(),
  clearq: () => { S.query = ''; $('q').value = ''; $('q').focus(); document.querySelector('[data-act="clearq"]').hidden = true; renderInvList(); },
  type: (d) => { S.type = d.type; renderInvList(); },
  exp: (d) => { S.exp = S.exp === d.id ? null : d.id; renderInvList(); },
  bkind: (d) => { S.bkind = d.kind; renderBuild(); },
  bexp: (d) => { S.bexp = S.bexp === d.id ? null : d.id; renderBuild(); },
  craft: (d) => { S.closed = new Set(); go({ tab: 'build', craft: [[d.id, 1]] }); },
  craftall: () => { S.closed = new Set(); const ts = (J.planner.targets || []); go({ tab: 'build', craft: ts.map((t) => [t.id, Math.max(1, t.now || 1)]) }); },
  craftback: () => go({ tab: 'build', craft: null }),
  craftn: (d) => { const i = +d.i, cur = S.craft[i][1], n = Math.max(1, Math.min(10000, d.n ? +d.n : cur + (+d.d)));
    if (n === cur) return; const c = S.craft.map((x) => [...x]); c[i][1] = n; go({ craft: c }, { push: false }); history.replaceState(null, '', hash()); },
  cview: (d) => { S.cview = d.v; renderCraft(); },
  node: (d) => { S.closed.has(d.path) ? S.closed.delete(d.path) : S.closed.add(d.path); drawTree(); },
};
function closeSheet() { $('sheet').hidden = true; $('sheet').innerHTML = ''; }
function zoomTo(x, y, w) { const box = wrapBox(), h = w * box.height / Math.max(box.width, 1); setView({ x: x - w / 2, y: y - h / 2, w, h }); drawSel(); drawIssue(); }
document.addEventListener('click', (e) => {
  const stop = e.target.closest('[data-stop]'), a = e.target.closest('[data-act]');
  if (!a || (stop && !stop.contains(a) && a.dataset.act === 'closesheet')) return;
  if (a.dataset.act === 'closesheet' && stop && a !== e.target.closest('.xbtn')) return;    // taps inside the sheet do not close it
  const fn = ACT[a.dataset.act]; if (fn) fn(a.dataset, a, e);
});
$('sheet').addEventListener('click', (e) => { if (e.target.classList.contains('scrim')) closeSheet(); });
function select(id) { S.sel = id; drawMap(); drawSel(); drawIssue(); }

// ---- map gestures: one finger pans, two pinch, the wheel zooms; a still tap selects ----
(() => {
  const svg = $('svg'), ptrs = new Map(); let pan = null, pinch = null, moved = 0;
  const pos = (e) => ({ x: e.clientX, y: e.clientY });
  svg.addEventListener('pointerdown', (e) => { svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, pos(e)); moved = 0;
    if (ptrs.size === 1) pan = { ...pos(e), view: { ...view } };
    else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, view: { ...view } }; pan = null; } });
  svg.addEventListener('pointermove', (e) => { if (!ptrs.has(e.pointerId) || !view) return; ptrs.set(e.pointerId, pos(e)); const r = wrapBox();
    if (ptrs.size === 2 && pinch) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), k = Math.min(Math.max(pinch.d / Math.max(d, 1), 0.02), 50);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, v0 = pinch.view, w = v0.w * k, h = v0.h * k;
      const sx = (pinch.mid.x - r.left) / r.width, sy = (pinch.mid.y - r.top) / r.height, mx = v0.x + sx * v0.w, my = v0.y + sy * v0.h;
      const cx = (mid.x - r.left) / r.width, cy = (mid.y - r.top) / r.height; moved = 99; S.follow = false; $('findme').classList.remove('on');
      setView({ x: mx - cx * w, y: my - cy * h, w, h }, false); }
    else if (ptrs.size === 1 && pan) { const dx = e.clientX - pan.x, dy = e.clientY - pan.y; moved = Math.max(moved, Math.hypot(dx, dy)); if (moved < 4) return;
      const k = pan.view.w / r.width; if (S.follow) { S.follow = false; $('findme').classList.remove('on'); } setView({ ...pan.view, x: pan.view.x - dx * k, y: pan.view.y - dy * k }, false); } });
  const up = (e) => { ptrs.delete(e.pointerId);
    if (ptrs.size === 0) { pan = null; if (pinch || moved > 4) drawMap(); pinch = null; }
    else if (ptrs.size === 1) { const [a] = [...ptrs.values()]; pinch = null; pan = { ...a, view: { ...view } }; } };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', (e) => { e.preventDefault(); if (view) zoomAt(e.deltaY > 0 ? 1.25 : 0.8, e.clientX, e.clientY); }, { passive: false });
  svg.addEventListener('click', (e) => { if (moved > 6) return; const t = e.target.closest('[data-hit]'); select(t ? t.dataset.hit : null); });
  svg.addEventListener('dblclick', (e) => { e.preventDefault(); zoomAt(0.5, e.clientX, e.clientY); });
  new ResizeObserver(() => { if (S.tab === 'map' && view) { const box = wrapBox(); setView({ ...view, h: view.w * box.height / Math.max(box.width, 1) }); } }).observe($('mapwrap'));
})();

// ---- live position (/api/live), polled while the map is on screen ----
let pollT = null, pollSeq = 0, reloadedFor = null;
async function pollLive(now = false) {
  clearTimeout(pollT);
  const seq = ++pollSeq;
  if (document.hidden || S.tab !== 'map') { pollT = setTimeout(pollLive, 2000); return; }
  try {
    const q = new URLSearchParams();
    if (S.level === 'base' && S.base) q.set('base', S.base);
    if (S.target) q.set('target', S.target.key);
    const got = await api('/api/live?' + q);
    if (seq !== pollSeq) return;
    LIVE = got;
    // show the player's planet the first time we see them on one (unless the URL chose a view), then follow them to other planets while Centre is on
    if (LIVE.on_planet && MAP && !MAP.planets.some((p) => p.address === LIVE.address) && reloadedFor !== LIVE.address) { reloadedFor = LIVE.address; await loadMap(); }
    if (LIVE.on_planet && MAP && planet() && LIVE.address !== S.planet && ((!S.placed && !S.userChose) || S.follow)) { S.placed = true; if (showMe(false)) return pollLive(); }
    if (S.follow && onThisPlanet() && S.level === 'planet') { const near = (LIVE.bases || [])[0]; if (near && near.dist < 300 && planet().layouts[near.base]) { go({ level: 'base', base: near.base }, { push: false }); return pollLive(); } }
    drawLivePill(); drawAway(); drawGoto(); drawLive();
    if (S.follow) centreOnMe();
    if (!$('selsheet').hidden && S.sel) drawSel();
    if ($('legend').innerHTML.includes('data-act="nearby"') !== !!(onThisPlanet() && LIVE.nearby && LIVE.nearby.length)) drawLegend();
  } catch (e) {
    if (seq !== pollSeq) return;
    LIVE = { state: 'none', error: String(e.message || e) };
    drawLivePill();
  }
  pollT = setTimeout(pollLive, LIVE && LIVE.state === 'live' ? 1000 : 3000);
}
function showMe(push = true) {
  if (!LIVE || !LIVE.on_planet || !MAP) { if (LIVE && !LIVE.on_planet) toast(`You're ${locName(LIVE.location).toLowerCase()} · ${LIVE.why || ''}`); return false; }
  const pl = MAP.planets.find((p) => p.address === LIVE.address);
  if (!pl) { loadMap().then(() => showMe(push)); return false; }
  const near = (LIVE.bases || [])[0], base = near && near.dist < 300 && pl.layouts[near.base] ? near.base : null;
  go({ tab: 'map', planet: pl.address, level: base ? 'base' : 'planet', base }, { push });
  S.follow = true; $('findme').classList.add('on');
  return true;
}

// ---- the fold: the engine's media queries when it has them, else what the Android shell reports ----
window.nmsFold = (f) => {
  const h = document.documentElement;
  h.dataset.posture = f.posture || 'none'; h.dataset.fold = f.orientation || '';
  if (f.left !== undefined && f.orientation === 'vertical') h.style.setProperty('--fold-gap', `${Math.max(16, Math.round(f.right - f.left) + 28)}px`);
  else h.style.removeProperty('--fold-gap');
};
if (SHELL && SHELL.fold) { try { window.nmsFold(JSON.parse(SHELL.fold())); } catch (e) { /* no fold yet */ } }

// ---- clocks ----
setInterval(() => {
  if (document.hidden) return;
  document.querySelectorAll('.saveage').forEach((e) => { e.textContent = J ? `● save ${fdur(elapsed())} ago` : '● no save yet'; e.className = `pill saveage ${!J ? 'off' : elapsed() < 1800 ? 'ok' : 'warn'}`; });
  tickFarms();
}, 1000);
setInterval(() => { if (!document.hidden) loadJson(); }, 60000);
setInterval(() => { if (!document.hidden) loadMap(); }, 300000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (Date.now() - jsonAt > 30000) loadJson(); if (Date.now() - mapAt > 120000) loadMap(); pollLive(true); } });

readHash();
render();
loadMap().then(() => loadJson()).then(() => pollLive(true));
</script>
</body>
</html>
