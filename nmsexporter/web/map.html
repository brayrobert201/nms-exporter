<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NMS map</title>
<style>
:root {
  /* the holly-dashboards dark palette (data-viz skill, validated) */
  --page: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321;
  --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-7: #9085e9;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  /* sequential blue (data-viz palette) for ground height, low = dark, high = light. Steps 600-200
     only: an empty cell means "never sampled", so the lowest height must still clear the surface. */
  --seq-1: #184f95; --seq-2: #1c5cab; --seq-3: #256abf; --seq-4: #2a78d6; --seq-5: #3987e5;
  --seq-6: #5598e7; --seq-7: #6da7ec; --seq-8: #86b6ef; --seq-9: #9ec5f4;
  /* diverging (data-viz palette blue <-> red, gray midpoint) for height around a water surface;
     arms are the documented dark slot hues stepped by opacity */
  --div-below: #3987e5; --div-mid: #383835; --div-above: #e66767;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink-1);
  font: 15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: grid; grid-template-rows: auto 1fr auto; }
header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px;
  border-bottom: 2px solid var(--axis); }
header h1 { font-size: 18px; margin: 0; font-weight: 600; }
header .crumbs { color: var(--ink-2); }
header .crumbs a { color: var(--ink-1); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
select, button { background: var(--surface-2); color: var(--ink-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font: inherit; }
button { cursor: pointer; }
.note { color: var(--ink-muted); font-size: 13px; margin-left: auto; }
main { position: relative; overflow: hidden; touch-action: none;
  background: radial-gradient(ellipse at 50% 42%, var(--surface-1) 0%, var(--page) 72%); }
/* glass: panels let the map show through, blurred */
.panel, .dock > div, .away, .mapctl button, .tip { background: color-mix(in srgb, var(--surface-1) 78%, transparent) !important;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); }
@keyframes pulse { 0% { transform: scale(0.6); opacity: 0.45; } 100% { transform: scale(1.9); opacity: 0; } }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0.15; } }
svg { width: 100%; height: 100%; display: block; cursor: grab; }
svg.dragging { cursor: grabbing; }
.panel { position: absolute; right: 12px; top: 12px; max-width: min(360px, calc(100% - 24px));
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
  color: var(--ink-2); display: none; }
.panel b { color: var(--ink-1); }
.panel .close { float: right; margin: -4px -6px 0 8px; padding: 0 8px; }
.dock { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap-reverse;
  gap: 8px; align-items: flex-end; justify-content: space-between; pointer-events: none; }
.dock > div { pointer-events: auto; max-width: min(420px, 100%); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; }
.dock > div:empty { display: none; }
.issues { max-height: 40vh; overflow: auto; }
.power { width: min(380px, 100%); color: var(--ink-2); font-size: 13px; }
.power b { color: var(--ink-1); font-size: 15px; }
.power table { border-collapse: collapse; margin-top: 6px; width: 100%; }
.power td { padding: 1px 0; } .power td + td { text-align: right; color: var(--ink-1); font-variant-numeric: tabular-nums; }
.pill.none { color: var(--ink-muted); }
.nearby { width: min(380px, 100%); max-height: 46vh; overflow: auto; color: var(--ink-2); }
@media (max-width: 700px) { .dock > div { font-size: 13px; } .issues { max-height: 22vh; } .nearby { max-height: 26vh; } }
.nearby h2 { cursor: pointer; font-size: 14px; margin: 0 0 4px; color: var(--ink-1); font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.nearby h2 span { color: var(--ink-muted); font-weight: 400; font-size: 13px; }
.nearby .row { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center; padding: 3px 0;
  cursor: pointer; }
.nearby .row.on { color: var(--ink-1); }
.nearby .row small { color: var(--ink-muted); }
.turn { display: block; width: 18px; height: 18px; color: var(--ink-1); }
.goto { border: 1px solid var(--axis); border-radius: 10px; padding: 6px 8px; margin: 2px 0 8px; color: var(--ink-1);
  display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; }
.goto .turn { width: 28px; height: 28px; }
.goto b { font-size: 17px; }
.goto button { padding: 2px 8px; }
.livepill { color: var(--ink-2); font-size: 13px; }
button.on { border-color: var(--ink-1); }
.glyphs { display: inline-flex; gap: 1px; vertical-align: middle; font-family: ui-monospace, monospace; }
.glyphs img { display: block; }
.viewmenu { position: relative; }
a.navlink { color: var(--ink-1); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; text-decoration: none; }
.mapctl[hidden] { display: none; }
#globe { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.mapctl { position: absolute; left: 12px; top: 64px; display: flex; flex-direction: column; gap: 6px; }
.mapctl button { width: 38px; height: 38px; padding: 0; font-size: 20px; line-height: 1; background: var(--surface-1); }
.mapctl button:disabled { color: var(--ink-muted); cursor: default; }
.away { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: min(560px, calc(100% - 120px));
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px;
  color: var(--ink-2); font-size: 14px; text-align: center; z-index: 4; }
.away b { color: var(--ink-1); }
.away.dbdown { top: 60px; z-index: 7; }
.away button { margin-left: 8px; padding: 3px 10px; }
.tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px 8px; font-size: 13px; color: var(--ink-1); white-space: nowrap; z-index: 5; }
footer button.chip { background: none; border: 0; padding: 2px 4px; color: var(--ink-2); font-size: 13px; border-radius: 6px; }
footer button.chip:hover { background: var(--surface-2); }
footer button.chip.off { color: var(--ink-muted); text-decoration: line-through; }
footer button.chip.off i { opacity: 0.3; }
.viewmenu summary { list-style: none; cursor: pointer; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; }
.viewmenu summary::-webkit-details-marker { display: none; }
.viewmenu > div { position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 10px; padding: 6px 4px; min-width: 200px; }
.viewmenu label { display: flex; gap: 10px; align-items: center; padding: 7px 10px; cursor: pointer; color: var(--ink-1); }
.viewmenu input { width: 18px; height: 18px; accent-color: var(--ink-2); }
.issues div { cursor: pointer; padding: 3px 0; color: var(--ink-2); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--surface-2); border: 1px solid currentColor; margin-right: 6px; }
.pill.critical { color: var(--critical); } .pill.serious { color: var(--serious); } .pill.warning { color: var(--warning); } .pill.good { color: var(--good); }
footer { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 8px 14px; border-top: 1px solid var(--axis);
  color: var(--ink-2); font-size: 13px; }
footer span i, footer button.chip i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
text { font-family: system-ui, sans-serif; }
/* Places / Sectors sheet: everything on the planet as a list, and how much of each sector you've charted */
.sheet { position: absolute; right: 12px; top: 12px; bottom: 12px; width: min(400px, calc(100% - 24px)); z-index: 6;
  border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; color: var(--ink-2);
  background: color-mix(in srgb, var(--surface-1) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); }
.sheet[hidden] { display: none; }
.sheet .tabs { display: flex; gap: 6px; padding: 10px 10px 6px; align-items: center; }
.sheet .tabs .close { margin-left: auto; padding: 2px 10px; }
.sheet .ctl { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 8px; border-bottom: 1px solid var(--axis); }
.sheet .ctl select { padding: 4px 6px; font-size: 13px; }
.sheet .ctl .count { color: var(--ink-muted); font-size: 13px; align-self: center; margin-left: auto; }
.sheet .body { overflow: auto; padding: 4px 10px 10px; flex: 1; }
.sheet .prow { display: grid; grid-template-columns: 22px 1fr auto auto; gap: 8px; align-items: center; padding: 6px 2px;
  border-bottom: 1px solid var(--grid); cursor: pointer; }
.sheet .prow:hover { background: var(--surface-2); }
.sheet .prow.on { color: var(--ink-1); }
.sheet .prow b { color: var(--ink-1); font-weight: 500; }
.sheet .prow small { display: block; color: var(--ink-muted); font-size: 12px; }
.sheet .prow .d { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-1); font-size: 13px; }
.sheet .prow button { padding: 2px 8px; font-size: 13px; }
.sheet .mk { width: 18px; height: 18px; display: block; }
.sheet .mk i { display: block; width: 10px; height: 10px; border-radius: 50%; margin: 4px; }
.sheet h3 { font-size: 13px; color: var(--ink-1); margin: 10px 0 2px; font-weight: 600; }
.sheet h3 span { color: var(--ink-muted); font-weight: 400; }
.sheet .srow { display: grid; grid-template-columns: 52px 1fr 92px; gap: 8px; align-items: center; padding: 4px 2px; cursor: pointer;
  border-bottom: 1px solid var(--grid); font-size: 13px; }
.sheet .srow:hover { background: var(--surface-2); }
.sheet .srow .id { color: var(--ink-1); font-weight: 600; }
.sheet .srow .bar { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.sheet .srow .bar i { display: block; height: 100%; background: var(--ink-2); border-radius: 3px; }
.sheet .srow .v { text-align: right; color: var(--ink-1); font-variant-numeric: tabular-nums; }
.sheet .srow.here .id::after { content: " ●"; color: var(--ink-1); }
.sheet .sgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 6px 0; }
.sheet .sgrid button, .sheet .sgrid span { padding: 4px 0; font-size: 12px; text-align: center; border-radius: 6px; }
.sheet .sgrid span.done { color: var(--ink-1); border: 1px solid var(--ink-2); }
.sheet .summary { padding: 8px 2px; font-size: 13px; }
.sheet .summary b { color: var(--ink-1); font-size: 15px; }
.sheet .empty { color: var(--ink-muted); padding: 12px 2px; }
</style>
</head>
<body>
<header>
  <h1>NMS map</h1>
  <select id="planet" aria-label="Planet"></select>
  <span class="crumbs" id="crumbs"></span>
  <a class="navlink" href="/systems">Systems</a>
  <button id="fit" title="Fit to screen">Fit</button>
  <button id="globebtn" title="Show the planet as a globe (true distances between far-apart bases)">Globe</button>
  <button id="placesbtn" title="Everything on this planet as a list, and the sectors you've charted">Places</button>
  <details class="viewmenu" id="viewmenu"><summary>Show ▾</summary><div id="viewopts"></div></details>
  <button id="follow" title="Centre on you: off, north up, facing up">Centre</button>
  <span class="livepill" id="livepill"></span>
  <span class="note" id="note"></span>
</header>
<main id="main">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
  <canvas id="globe" hidden></canvas>
  <div class="panel" id="panel"></div>
  <div class="tip" id="tip" hidden></div>
  <div class="sheet" id="sheet" hidden>
    <div class="tabs"><button id="tabplaces" class="on">Places</button><button id="tabsectors">Sectors</button><button class="close" id="sheetclose" aria-label="Close">×</button></div>
    <div class="ctl" id="sheetctl"></div>
    <div class="body" id="sheetbody"></div>
  </div>
  <div class="away" id="away" hidden></div>
  <div class="away dbdown" id="dbdown" hidden></div>
  <div class="mapctl"><button id="zin" title="Zoom in" aria-label="Zoom in">+</button><button id="zout" title="Zoom out" aria-label="Zoom out">−</button><button id="findme" title="Centre on you once" aria-label="Centre on you">◎</button></div>
  <div class="dock"><div class="issues" id="issues"></div><div class="power" id="power"></div><div class="nearby" id="nearby"></div></div>
</main>
<footer id="legend"></footer>
<script>
"use strict";
// Portal glyphs, 0-F, served from /glyph/<digit>.png (scripts/nms-glyphs); the hex digit stands in if an image is missing.
const GLYPH_NAMES = ["Sunset", "Bird", "Face", "Diplo", "Eclipse", "Balloon", "Boat", "Bug", "Dragonfly", "Galaxy", "Voxel", "Fish", "Tent", "Rocket", "Tree", "Atlas"];
const glyphs = (code, px = 18) => `<span class="glyphs" title="${code} — ${[...code].map(c => GLYPH_NAMES[parseInt(c, 16)]).join(", ")}">`
  + [...code.toLowerCase()].map(c => `<img src="/glyph/${c}.png" width="${px}" height="${px}" alt="${c.toUpperCase()}" onerror="this.replaceWith(document.createTextNode('${c.toUpperCase()}'))">`).join("") + "</span>";
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const fmtDist = (m) => m >= 10000 ? (m / 1000).toFixed(0) + " km" : m >= 1000 ? (m / 1000).toFixed(1) + " km" : Math.round(m) + " m";
const bearing = (e, n) => ((Math.atan2(e, n) * 180 / Math.PI) + 360) % 360;
const compass = (deg) => ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(deg / 45) % 8];

// Kinds: series colours for categories, status hues only for problems.
const KIND = {
  "base":              { label: "Base",              colour: "--series-1", r: 7 },
  "exocraft":          { label: "Exocraft",          colour: "--series-7", r: 5 },
  "deposit":           { label: "Drained deposit",   colour: "--ink-muted", r: 4 },
  "settlement":        { label: "Settlement",        colour: "--series-4", r: 6 },
  "extractor-mineral": { label: "Mineral extractor", colour: "--series-1", r: 1.6 },
  "extractor-gas":     { label: "Gas extractor",     colour: "--series-3", r: 1.6 },
  "depot":             { label: "Depot",             colour: "--ink-2",    r: 1.2 },
  "power":             { label: "Power",             colour: "--series-4", r: 1.4 },
  "refiner":           { label: "Refiner",           colour: "--series-2", r: 1.4 },
  "teleporter":        { label: "Teleporter",        colour: "--series-7", r: 1.6 },
  "computer":          { label: "Base computer",     colour: "--ink-1",    r: 2.2 },
  "plants":            { label: "Plants",            colour: "--series-3", r: 1.0 },
  "structure":         { label: "Structure",         colour: "--axis",     r: 1.0 },
  // finds from the analysis visor (pymhf_mods/visor_log.py): diamonds and squares, not circles
  "hotspot-mineral":   { label: "Mineral hotspot",   colour: "--series-1", r: 1.6 },
  "hotspot-gas":       { label: "Gas hotspot",       colour: "--series-3", r: 1.6 },
  "hotspot-power":     { label: "Power hotspot",     colour: "--series-4", r: 1.6 },
  "deposit-find":      { label: "Resource deposit",  colour: "--ink-2",    r: 1.2 },
  "mark":              { label: "Your mark",         colour: "--ink-1",    r: 1.2 },
};
const findKind = (k) => k === "deposit" ? "deposit-find" : k;

// The game's own HUD icons (scripts/nms-icons, served at /icon/<name>.png). Hotspots use the
// survey icon with its class letter, like the visor. Without the icons the map keeps its shapes.
let ICONS = false;
const ICON = { base: "base", exocraft: "vehicle", settlement: "settlement", deposit: "pickup.terrain",
  "deposit-find": "pickup.mineral", mark: "custommarker" };
const SURVEY = { "hotspot-mineral": "minerals", "hotspot-gas": "gas", "hotspot-power": "power" };
function iconOf(kind, cls) {
  if (!ICONS) return null;
  if (SURVEY[kind]) return `surveying.${SURVEY[kind]}${cls ? cls.toLowerCase() : ""}`;
  return ICON[kind] || null;
}
// Hide a label that would overlap a more important one (marks 5, problems 5, bases 4, hotspots 3);
// zooming in brings it back. Screen-space boxes, so it works when the map is rotated too.
function declutter() {
  const ts = [...document.querySelectorAll("#world text[data-x]")];
  ts.forEach(t => t.style.visibility = "");
  ts.sort((a, b) => (+b.dataset.pri || 2) - (+a.dataset.pri || 2));
  const kept = [];
  for (const t of ts) {
    const r = t.getBoundingClientRect();
    if (!r.width) continue;
    if (kept.some(q => r.left < q.right && r.right > q.left && r.top < q.bottom && r.bottom > q.top)) t.style.visibility = "hidden";
    else kept.push(r);
  }
}

// an icon of `size` screen pixels at (x, y) in map units; rescale() keeps it that size
function icon(g, x, y, name, size) {
  const k = px();
  return el("image", { href: `/icon/${name}.png`, x: x - size * k / 2, y: -y - size * k / 2, width: size * k, height: size * k,
    "data-icon": size, "data-cx": x, "data-cy": y }, g);
}
const SEG = { pipe: { colour: "--ink-muted", w: 0.5, label: "Pipe" },
              wire: { colour: "--series-4", w: 0.35, dash: "1.2 0.8", label: "Wire" },
              link: { colour: "--series-7", w: 0.35, dash: "0.5 1", label: "Wire teleport" } };

let data = null, planet = null, base = null;
let view = { x: 0, y: 0, w: 100, h: 100 };   // viewBox in map units (east right, north up)

function setView(v) {
  view = v;
  $("svg").setAttribute("viewBox", `${v.x} ${-v.y - v.h} ${v.w} ${v.h}`);
  drawScale();
}

// Height (px) of the map hidden by dock panels that reach into its middle third; 0 if they would leave too little.
function coveredBottom() {
  const main = $("main").getBoundingClientRect();
  let h = 0;
  for (const d of document.querySelectorAll(".dock > div")) {
    if (d.hidden || !d.innerHTML) continue;
    const r = d.getBoundingClientRect();
    if (r.width && r.right > main.left + main.width / 3 && r.left < main.right - main.width / 3) h = Math.max(h, main.bottom - r.top);
  }
  return h < main.height * 0.6 ? h : 0;
}

function fit(points, pad = 0.12, minSize = 40) {
  const box = $("main").getBoundingClientRect();
  const cov = coveredBottom(), bh = Math.max(box.height - cov, 1);
  const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  let minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  let w = Math.max(maxx - minx, minSize), h = Math.max(maxy - miny, minSize);
  const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
  w *= 1 + 2 * pad; h *= 1 + 2 * pad;
  const aspect = box.width / bh;
  if (w / h > aspect) h = w / aspect; else w = h * aspect;
  const H = h * box.height / bh;              // full viewBox height; the content sits in the uncovered part
  setView({ x: cx - w / 2, y: cy - h / 2 - (H - h), w, h: H });
  fittedView = view;
}
let fittedView = null;

// Marks are drawn in screen pixels: they stay the same size while zooming.
function px() { return view.w / Math.max($("main").getBoundingClientRect().width, 1); }

// The planet's own terrain colours (live_position 0.4) tint the map's backdrop and the globe faintly:
// ambience only, nothing is encoded in them. Average of the 23 tile colours.
function planetTint() {
  const tc = planet && planet.tile_colours;
  if (!tc || !tc.length) return null;
  const avg = [0, 1, 2].map(i => tc.reduce((a, c) => a + c[i], 0) / tc.length);
  return `rgb(${avg.map(v => Math.round(v * 255)).join(",")})`;
}
function applyTint() {
  const t = planetTint();
  $("main").style.background = t
    ? `radial-gradient(ellipse at 50% 42%, color-mix(in srgb, ${t} 22%, var(--surface-1)) 0%, var(--page) 74%)` : "";
}

function render() {
  applyTint();
  const svg = $("svg");
  svg.innerHTML = "";
  const world = el("g", { id: "world" }, svg);
  el("g", { id: "grid" }, world);
  el("g", { id: "elev" }, world);
  el("g", { id: "sect" }, world);
  const g = el("g", { id: "content" }, world);
  el("g", { id: "finds" }, world);
  el("g", { id: "sel" }, world);
  el("g", { id: "hits" }, world);
  el("g", { id: "findhits" }, world);      // above built objects' targets: extractors sit on their hotspot
  el("g", { id: "live" }, world);
  el("g", { id: "scale" }, svg);
  drawPower();                 // before fitting, so fit() knows what the panels cover
  base ? drawBase(g) : drawPlanet(g);
  rescale();
  drawScale();
  crumbs();
  loadElevation();
  loadFinds();
  loadSectors();
  if (globeOn) { if (base) setGlobe(false); else setGlobe(true); }
}

function rescale() {
  // keep marks a constant on-screen size
  const k = px();
  document.querySelectorAll("[data-r]").forEach(c => c.setAttribute("r", c.dataset.r * k));
  document.querySelectorAll("[data-w]").forEach(l => {
    l.setAttribute("stroke-width", l.dataset.w * k);
    if (l.dataset.dash) l.setAttribute("stroke-dasharray", l.dataset.dash.split(" ").map(x => x * k * 3).join(" "));
  });
  document.querySelectorAll("[data-fs]").forEach(t => {
    t.setAttribute("font-size", t.dataset.fs * k);
    t.setAttribute("x", +t.dataset.x + 10 * k); t.setAttribute("y", -t.dataset.y + (4 + (+t.dataset.dy || 0)) * k);
  });
  document.querySelectorAll("[data-icon]").forEach(i => {
    const s = i.dataset.icon * k;
    i.setAttribute("width", s); i.setAttribute("height", s);
    i.setAttribute("x", i.dataset.cx - s / 2); i.setAttribute("y", -i.dataset.cy - s / 2);
  });
  drawSel();
  if (typeof drawFinds === "function") drawFinds();
  drawLive();
  if (typeof rotate === "function") rotate();
  declutter();
}

// Kinds and segment types switched off in the legend; remembered per device.
let hiddenKinds = new Set();
try { hiddenKinds = new Set(JSON.parse(localStorage.getItem("nms-map-hidden-kinds") || "[]")); } catch (e) { /* none hidden */ }
function toggleKind(k) {
  hiddenKinds.has(k) ? hiddenKinds.delete(k) : hiddenKinds.add(k);
  try { localStorage.setItem("nms-map-hidden-kinds", JSON.stringify([...hiddenKinds])); } catch (e) { /* not remembered */ }
  const v = { ...view };
  render(); setView(v); rescale();          // keep the current view
}

function dot(g, x, y, kind, onclick, problems, tipText) {
  if (hiddenKinds.has(kind) && !problems) return null;
  const k = KIND[kind] || KIND.structure;
  const r = kind.startsWith("extractor") || kind === "computer" ? 5 : kind === "base" ? 8 : kind === "structure" ? 2.5 : 4;
  const ic = iconOf(kind);
  const c = ic ? icon(g, x, y, ic, kind === "base" ? 30 : 24)
    : el("circle", { cx: x, cy: -y, "data-r": problems ? r + 2 : r, fill: css(k.colour),
      stroke: problems ? css("--critical") : css("--page"), "data-w": problems ? 3 : 1,
      ...(kind === "structure" ? { opacity: 0.7 } : {}) }, g);
  if (ic && problems) el("circle", { cx: x, cy: -y, "data-r": 18, fill: "none", stroke: css("--critical"), "data-w": 3 }, g);
  if (onclick) {
    // a finger-sized invisible target above every mark; the mark itself stays small
    const hit = el("circle", { cx: x, cy: -y, "data-r": Math.max(r + 6, 14), fill: "transparent", cursor: "pointer" }, $("hits"));
    hit.addEventListener("click", (ev) => { ev.stopPropagation(); onclick(); });
    const text = tipText || (KIND[kind] || {}).label || kind;
    hit.addEventListener("pointerenter", (ev) => { if (ev.pointerType === "mouse") tip(text, ev); });
    hit.addEventListener("pointermove", (ev) => { if (ev.pointerType === "mouse") tip(text, ev); });
    hit.addEventListener("pointerleave", () => { $("tip").hidden = true; });
  }
  return c;
}

function tip(text, ev) {
  const T = $("tip"), m = $("main").getBoundingClientRect();
  T.textContent = text;
  T.hidden = false;
  const x = Math.min(ev.clientX - m.left + 14, m.width - T.offsetWidth - 8);
  T.style.left = `${Math.max(8, x)}px`;
  T.style.top = `${Math.max(8, ev.clientY - m.top - 34)}px`;
}

let selected = null;      // [x, y] of the item whose details are open
function drawSel() {
  const g = $("sel");
  if (!g) return;
  g.innerHTML = "";
  if (selected) el("circle", { cx: selected[0], cy: -selected[1], r: 13 * px(), fill: "none", stroke: css("--ink-1"), "stroke-width": 2 * px() }, g);
}

function label(g, x, y, text, colour = "--ink-2", fs = 13, pri = 2) {
  // dark outline under the glyphs keeps labels readable over height cells and lines
  const t = el("text", { "data-x": x, "data-y": y, "data-fs": fs, "data-pri": pri, fill: css(colour), stroke: css("--page"),
    "data-w": 3, "paint-order": "stroke", "stroke-linejoin": "round" }, g);
  t.textContent = text;
  return t;
}

function drawPlanet(g) {
  const pts = planet.points;
  for (const p of pts.filter(p => p.kind !== "base")) dot(g, p.x, p.y, p.kind, () => show(p), false, p.name);
  const m = live && live.on_planet && live.address === planet.address ? [[live.player.x, live.player.y]] : [[0, 0]];
  fit(pts.length ? pts.map(p => [p.x, p.y]) : m, 0.25, pts.length ? 3000 : 600);
  const k = px(), placed = [];
  for (const p of pts.filter(p => p.kind === "base").sort((a, b) => b.y - a.y)) {
    dot(g, p.x, p.y, "base", () => openBase(p.name), p.loose > 0, `${p.name} · open layout`);
    // stack labels of bases that sit within a label's height of each other
    const dy = placed.filter(q => Math.abs(q.x - p.x) < 160 * k && Math.abs(q.y - p.y) < 18 * k).length;
    placed.push(p);
    const t = label(g, p.x, p.y, p.name + (p.loose ? `  ⚠ ${p.loose} loose` : ""), p.loose ? "--critical" : "--ink-1", 14, 4);
    t.dataset.dy = dy * 18;
  }
  issues(pts.filter(p => p.loose).map(p => ({ text: `${p.name}: ${p.loose} loose extractor${p.loose > 1 ? "s" : ""}`,
    go: () => openBase(p.name) })));
  legend(["base", "exocraft", "settlement", "deposit"].filter(k => pts.some(p => p.kind === k)), []);
}

const POWER = { good: "✓", warning: "⚠", critical: "✕", none: "–" };
const powerPill = (pw) => `<span class="pill ${pw.status}">${POWER[pw.status]} ${pw.headline}</span>`;

function drawPower() {
  const P = $("power");
  const pw = base && planet.layouts[base] ? planet.layouts[base].power : null;
  if (!pw || pw.status === "none") { P.innerHTML = ""; return; }
  const kp = (v) => `${Math.round(v).toLocaleString()} kP`;
  const rows = [["Extractors", `${pw.extractors} × 50 = ${kp(pw.demand_kp)}`]];
  if (pw.em) rows.push(["Electromagnetic generators", `${pw.em}: ${kp(pw.em_kp[0])}–${kp(pw.em_kp[1])}`]);
  if (pw.solar) rows.push(["Solar (daytime)", `${pw.solar}: ${kp(pw.solar_kp)}`]);
  if (pw.bio) rows.push(["Biofuel (if fuelled)", `${pw.bio}: ${kp(pw.bio_kp)}`]);
  if (pw.batteries) rows.push(["Batteries at last save", `${pw.charge_pct}%` + (pw.battery_minutes ? ` · ${pw.battery_minutes} min of extraction` : "")]);
  if (pw.other_up_to_kp) rows.push(["Other powered parts, if wired", `up to ${kp(pw.other_up_to_kp)}`]);
  P.innerHTML = `<b id="powerhead" style="cursor:pointer" title="Show or hide the details">${powerOpen ? "▾" : "▸"} Power</b> ${powerPill(pw)}`
    + (powerOpen ? `<div>${pw.why || ""}</div><table>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>` : "");
  $("powerhead").onclick = () => { powerOpen = !powerOpen; drawPower(); };
}
let powerOpen = window.innerWidth > 700;     // a phone starts with the one-line verdict

function drawBase(g) {
  const lay = planet.layouts[base];
  if (!lay) { label(g, 0, 0, "No layout for this base"); return; }
  // Building shapes: each object's ground rectangle from the game's collision boxes, lowest first so
  // upper floors and roofs lie over what is under them. Overlapping storeys build up the fill.
  const shapes = shown.shapes && lay.items.some(i => i.poly);
  if (shapes) {
    for (const it of [...lay.items].filter(i => i.poly && !hiddenKinds.has(i.kind)).sort((a, b) => a.top - b.top)) {
      const st = it.kind === "structure", c = css(st ? "--ink-2" : (KIND[it.kind] || {}).colour || "--ink-2");
      const poly = el("polygon", { points: it.poly.map(([e, n]) => `${e},${-n}`).join(" "), fill: c,
        "fill-opacity": st ? 0.13 : 0.32, stroke: c, "stroke-opacity": st ? 0.4 : 0.85, "data-w": st ? 0.6 : 1,
        "stroke-linejoin": "round" }, g);
      if (st) {
        poly.style.cursor = "pointer";
        const text = `${it.id.replace(/_/g, " ").toLowerCase()} · top ${it.top >= 0 ? "+" : ""}${it.top} m`;
        poly.addEventListener("click", (ev) => { ev.stopPropagation(); show(it); });
        poly.addEventListener("pointermove", (ev) => { if (ev.pointerType === "mouse") tip(text, ev); });
        poly.addEventListener("pointerleave", () => { $("tip").hidden = true; });
      }
    }
  }
  for (const s of lay.segments) {
    if (hiddenKinds.has(s.kind)) continue;
    const st = SEG[s.kind];
    el("line", { x1: s.a[0], y1: -s.a[1], x2: s.b[0], y2: -s.b[1], stroke: css(st.colour), "data-w": st.w * 4,
      ...(st.dash ? { "data-dash": st.dash } : {}), "stroke-linecap": "round" }, g);
  }
  const order = ["structure", "plants", "depot", "power", "refiner", "teleporter", "extractor-mineral", "extractor-gas", "computer"];
  const items = [...lay.items].sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind) || !!a.problems - !!b.problems);
  for (const it of items) if (!(shapes && it.kind === "structure" && it.poly)) dot(g, it.e, it.n, it.kind, () => show(it), !!it.problems,
    (KIND[it.kind] || {}).label + (Math.hypot(it.e, it.n) < 2 ? "" : ` · ${fmtDist(Math.hypot(it.e, it.n))} ${compass(bearing(it.e, it.n))} of the computer`));
  const loose = lay.items.filter(i => i.problems);
  for (const it of loose) label(g, it.e, it.n, "⚠ " + it.problems.join(", "), "--critical", 13, 5);
  fit(lay.items.map(i => [i.e, i.n]), 0.06);
  issues(loose.map(it => {
    const d = Math.hypot(it.e, it.n);
    return { text: `⚠ ${it.kind.replace("extractor-", "")} extractor: ${it.problems.join(", ")} — ${fmtDist(d)} ${compass(bearing(it.e, it.n))} of the computer`,
      go: () => { zoomTo(it.e, it.n, 60); show(it); } };
  }));
  const kinds = [...new Set(lay.items.map(i => i.kind))].sort((a, b) => order.indexOf(a) - order.indexOf(b));
  legend(kinds, [...new Set(lay.segments.map(s => s.kind))]);
}

function zoomTo(x, y, w) {
  const box = $("main").getBoundingClientRect();
  const h = w * box.height / Math.max(box.width, 1);
  setView({ x: x - w / 2, y: y - h / 2, w, h });
  rescale();
}

function show(p) {
  const P = $("panel");
  const rows = [];
  selected = p.e !== undefined ? [p.e, p.n] : [p.x, p.y];
  drawSel();
  if (p.kind === "base") {
    rows.push(`<b>${p.name}</b>`, `${p.objects} objects`, `lat ${p.lat}°, lon ${p.lon}°`);
    if (p.power && p.power !== "none") rows.push(`Power: <span class="pill ${p.power}">${POWER[p.power]} ${p.power_headline}</span>`);
    if (planet.portal) rows.push(`Portal: ${glyphs(planet.portal, 22)}`);
  } else if (p.name) rows.push(`<b>${p.name}</b>`);
  else rows.push(`<b>${(KIND[p.kind] || {}).label || p.kind}</b> <span style="color:var(--ink-muted)">${p.id || ""}</span>`);
  if (p.e !== undefined) {
    const d = Math.hypot(p.e, p.n);
    rows.push(`${fmtDist(d)} ${compass(bearing(p.e, p.n))} (${Math.round(bearing(p.e, p.n))}°) of the base computer, ${p.h >= 0 ? "+" : ""}${p.h} m height`);
  } else if (p.x !== undefined && planet) {
    rows.push(`${fmtDist(Math.hypot(p.x, p.y))} ${compass(bearing(p.x, p.y))} of the map centre`);
  }
  if (p.problems) {
    rows.push(p.problems.map(x => `<span class="pill critical">⚠ ${x}</span>`).join(" "));
    rows.push(`fill ${p.fill}/250 · nearest pipe end ${p.pipe_gap} m`);
    if (p.near) rows.push(p.near);
  }
  const btns = [];
  if (p.kind === "base") btns.push(`<button onclick="openBase(${JSON.stringify(p.name).replace(/"/g, "&quot;")})">Open layout</button>`);
  const key = p.kind === "base" ? `b:${p.name}` : p.i !== undefined && base ? `o:${base}:${p.i}` : p.w ? `w:${p.w.join(",")}` : null;
  if (key) {
    const lbl = p.name || `${(KIND[p.kind] || {}).label || p.kind}${base ? " · " + base : ""}`;
    btns.push(`<button onclick='setTarget(${JSON.stringify(key).replace(/'/g, "&#39;")}, ${JSON.stringify(lbl).replace(/'/g, "&#39;")})'>Go to</button>`);
  }
  if (btns.length) rows.push(btns.join(" "));
  P.innerHTML = `<button class="close" onclick="closePanel()">×</button>` + rows.join("<br>");
  P.style.display = "block";
}

function closePanel() { $("panel").style.display = "none"; selected = null; drawSel(); }
window.closePanel = closePanel;

function issues(list) {
  const I = $("issues");
  I.innerHTML = "";
  for (const it of list) {
    const d = document.createElement("div");
    d.innerHTML = `<span class="pill critical">⚠ loose</span>` + it.text.replace(/^⚠ /, "");
    d.onclick = it.go;
    I.appendChild(d);
  }
}

function legend(kinds, segs) {
  const L = $("legend");
  const sw = (k, fallback) => iconOf(k) ? `<img src="/icon/${iconOf(k)}.png" width="16" height="16" style="vertical-align:-3px;margin-right:4px">` : fallback;
  const chip = (key, swatch, text) => `<button class="chip${hiddenKinds.has(key) ? " off" : ""}" data-kind="${key}" title="Show or hide">${swatch}${text}</button>`;
  L.innerHTML = kinds.map(k => chip(k, sw(k, `<i style="background:${css(KIND[k].colour)}"></i>`), KIND[k].label)).join("")
    + segs.map(s => chip(s, `<i style="border-radius:0;height:3px;background:${css(SEG[s].colour)}"></i>`, SEG[s].label)).join("")
    + `<span><i style="background:transparent;border:2px solid ${css("--critical")}"></i>⚠ problem</span>`
    + `<span><i style="border-radius:0;clip-path:polygon(50% 0,100% 100%,50% 75%,0 100%);background:${css("--ink-1")}"></i>You</span>`
    + `<span><i style="border-radius:0;height:3px;background:${css("--ink-muted")}"></i>Your trail</span>`;
  L.querySelectorAll("button.chip").forEach(b => b.onclick = () => toggleKind(b.dataset.kind));
  if (typeof legendHeights === "function") legendHeights();
  if (typeof legendFinds === "function") legendFinds();
}

function crumbs() {
  const C = $("crumbs");
  const where = planet.planet_name ? `<b>${planet.planet_name}</b>${planet.system_name ? ` in ${planet.system_name}` : ""} · ` : planet.system_name ? `${planet.system_name} · ` : "";
  C.innerHTML = base ? `<a onclick="openPlanet()">${planet.planet_name || (planet.bases.length === 1 ? "Planet" : planet.label)}</a> › ${base}` : where + `${planet.bases.length ? `${planet.bases.length} base${planet.bases.length === 1 ? "" : "s"}` : "No bases"} · radius ${fmtDist(planet.radius)}`;
}

function niceLen(target) {
  const pow = Math.pow(10, Math.floor(Math.log10(target)));
  return [1, 2, 5, 10].map(m => m * pow).filter(v => v <= target).pop() || pow;
}

// Recessive grid at the scale-bar spacing; drawn wide enough to cover the view when it is rotated.
function drawGrid() {
  const g = $("grid");
  if (!g) return;
  g.innerHTML = "";
  const k = px(), step = niceLen(120 * k), r = Math.hypot(view.w, view.h);
  const cx = view.x + view.w / 2, cy = view.y + view.h / 2;
  const x0 = Math.floor((cx - r) / step) * step, y0 = Math.floor((cy - r) / step) * step;
  const d = [];
  for (let x = x0; x <= cx + r; x += step) d.push(`M ${x} ${-(cy + r)} V ${-(cy - r)}`);
  for (let y = y0; y <= cy + r; y += step) d.push(`M ${cx - r} ${-y} H ${cx + r}`);
  el("path", { d: d.join(" "), stroke: css("--grid"), "stroke-width": k, fill: "none" }, g);
}

function drawScale() {
  const s = $("scale");
  if (!s) return;
  s.innerHTML = "";
  drawGrid();
  const k = px();
  const len = niceLen(120 * k);
  const x0 = view.x + view.w - len - 16 * k, y0 = -view.y - 22 * k;
  el("line", { x1: x0, y1: y0, x2: x0 + len, y2: y0, stroke: css("--ink-2"), "stroke-width": 2 * k }, s);
  const t = el("text", { x: x0, y: y0 - 6 * k, fill: css("--ink-2"), "font-size": 12 * k }, s);
  t.textContent = fmtDist(len);
  // north arrow, top left
  const ax = view.x + 24 * k, ay = -view.y - view.h + 40 * k;
  const r = typeof rotation === "function" ? rotation() : null;
  const na = el("g", r ? { transform: `rotate(${r.a} ${ax} ${ay - 2 * k})` } : {}, s);
  el("path", { d: `M ${ax} ${ay - 18 * k} L ${ax - 6 * k} ${ay} L ${ax + 6 * k} ${ay} Z`, fill: css("--ink-2") }, na);
  const n = el("text", { x: ax - 4 * k, y: ay + 16 * k, fill: css("--ink-2"), "font-size": 12 * k,
    ...(r ? { transform: `rotate(${-r.a} ${ax} ${ay + 12 * k})` } : {}) }, na);
  n.textContent = data && data.north_verified ? "N" : "N?";
}

function openPlanet() { base = null; userChose = true; $("panel").style.display = "none"; render(); poll(); }
function openBase(name) { if (globeOn) setGlobe(false); base = name; userChose = true; $("panel").style.display = "none"; render(); poll(); }
window.openBase = openBase; window.openPlanet = openPlanet;

// pan and zoom: drag, wheel, pinch
(() => {
  const svg = $("svg");
  const ptrs = new Map();
  let last = null, lastDist = null;
  const toMap = (cx, cy) => {
    const b = svg.getBoundingClientRect();
    return [view.x + (cx - b.left) / b.width * view.w, view.y + (1 - (cy - b.top) / b.height) * view.h];
  };
  const zoom = (f, cx, cy) => {
    if (follow) {                         // zoom about you, not the cursor (the map may be rotated)
      setView({ x: view.x + view.w * (1 - f) / 2, y: view.y + view.h * (1 - f) / 2, w: view.w * f, h: view.h * f });
      centreOnMe(); rescale();
      return;
    }
    const [mx, my] = toMap(cx, cy);
    setView({ x: mx - (mx - view.x) * f, y: my - (my - view.y) * f, w: view.w * f, h: view.h * f });
    rescale();
  };
  const centre = () => { const b = svg.getBoundingClientRect(); return [b.left + b.width / 2, b.top + (b.height - coveredBottom()) / 2]; };
  $("zin").onclick = () => zoom(1 / 1.6, ...centre());
  $("zout").onclick = () => zoom(1.6, ...centre());
  $("findme").onclick = () => { const m = me(); if (m) { setView({ ...view, x: m.x - view.w / 2, y: m.y - view.h / 2 - coveredBottom() / 2 * px() }); rescale(); } };
  svg.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse" || e.target.closest("#hits, #findhits") || !terrain || rotation()) return;
    const [mx, my] = toMap(e.clientX, e.clientY), h = heightAt(mx, my);
    if (h === null) { $("tip").hidden = true; return; }
    tip(heightText(h), e);
  });
  svg.addEventListener("pointerleave", () => { $("tip").hidden = true; });
  svg.addEventListener("wheel", (e) => { e.preventDefault(); zoom(Math.exp(e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
  let moved = 0;
  // capture only once a drag starts: capturing on press would steal the click from the mark under a tap
  svg.addEventListener("pointerdown", (e) => { moved = 0; ptrs.set(e.pointerId, e); last = e; svg.classList.add("dragging"); });
  svg.addEventListener("pointermove", (e) => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, e);
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      if (lastDist) zoom(lastDist / d, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
      lastDist = d;
      return;
    }
    const b = svg.getBoundingClientRect();
    moved += Math.hypot(e.clientX - last.clientX, e.clientY - last.clientY);
    if (moved > 4 && !svg.hasPointerCapture(e.pointerId)) svg.setPointerCapture(e.pointerId);
    if (follow && moved < 8) return;            // a tap, not a drag: keep centring
    if (follow) setFollow(0);
    cancelAnimationFrame(glide);
    const dx = (e.clientX - last.clientX) / b.width * view.w, dy = (e.clientY - last.clientY) / b.height * view.h;
    setView({ ...view, x: view.x - dx, y: view.y + dy });
    last = e;
  });
  const up = (e) => { ptrs.delete(e.pointerId); lastDist = null; if (!ptrs.size) svg.classList.remove("dragging"); last = [...ptrs.values()][0] || null; };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
})();

$("fit").onclick = () => render();
$("planet").onchange = (e) => { userChose = true; planet = data.planets[+e.target.value]; base = planet.bases.length === 1 ? planet.bases[0] : null; render(); };
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });

async function load() {
  try { ICONS = (await fetch("/icon/base.png", { method: "HEAD" })).ok; } catch (e) { ICONS = false; }
  const r = await fetch("/api/map", { cache: "no-store" });
  data = await r.json();
  dbCheck({ db: !(data.errors || {})["nms-db"], error: (data.errors || {})["nms-db"] });
  const sel = $("planet");
  sel.innerHTML = data.planets.map((p, i) => `<option value="${i}">${p.label}${p.planet_name && !p.visited ? ` · ${p.planet_name}` : ""}${p.points.some(q => q.loose) ? " ⚠" : ""}</option>`).join("");
  const q = new URLSearchParams(location.search);
  const want = q.get("base"), wantPlanet = q.get("planet");
  userChose = !!(want || wantPlanet);
  const named = (p, n) => n && (p.bases.includes(n) || p.planet_name === n || p.label === n || (p.label || "").startsWith(n + " "));
  let pi = data.planets.findIndex(p => named(p, want) || named(p, wantPlanet));
  if (pi < 0) pi = Math.max(0, data.planets.findIndex(p => p.points.some(x => x.loose)));
  sel.value = pi;
  planet = data.planets[pi];
  base = want && planet.bases.includes(want) ? want : wantPlanet ? null : planet.bases.length === 1 ? planet.bases[0] : null;
  $("note").textContent = data.north_verified ? "" : "North and east/west not yet checked against the in-game compass";
  render();
  const at = (q.get("at") || "").split(",").map(Number);       // ?at=east,north,width in metres: open zoomed there
  if (at.length === 3 && at.every(Number.isFinite)) zoomTo(at[0], at[1], at[2]);
  if (["places", "sectors"].includes(q.get("sheet"))) { sheetTab = q.get("sheet"); openSheet(true); }   // ?sheet=places|sectors
  if (q.get("globe") === "1") setGlobe(true);
  applyView();
  poll();
}

// ---- finds: hotspots and deposits seen through the analysis visor (/api/finds) ----
let finds = null, findsTimer = null;
async function loadFinds() {
  clearTimeout(findsTimer);
  if (!planet) return;
  const want = `${planet.address}|${base}`;
  const q = new URLSearchParams({ address: planet.address });
  if (base) q.set("base", base);
  try {
    const got = dbCheck(await (await fetch("/api/finds?" + q, { cache: "no-store" })).json());
    if (got && want === `${planet.address}|${base}`) { finds = got; drawFinds(); legendFinds(); }
  } catch (e) { /* the layer just stays empty */ }
  findsTimer = setTimeout(loadFinds, 15000);
}

function findPos(f) { return base ? (f.e === undefined ? null : [f.e, f.n]) : [f.x, f.y]; }
function findTitle(f) {
  const k = (f.class ? `Class ${f.class} ` : "") + KIND[findKind(f.kind)].label.replace(/^./, c => f.class ? c.toLowerCase() : c);
  return f.kind === "mark" ? `Your mark: ${f.name}` : f.kind === "deposit" ? `${f.resource} deposit` : `${k}${f.resource ? ` · ${f.resource}` : ""}`;
}

function drawFinds() {
  const g = $("finds"), hits = $("findhits");
  if (!g) return;
  g.innerHTML = ""; hits.innerHTML = "";
  if (!finds) return;
  const k = px();
  const reach = (f) => ((finds.ranges || {})[f.kind] || finds.range_m || [190])[0];
  // Zoomed out, finds closer than 26 screen px group under the most important one with a count
  // (recorded hotspots, then other hotspots, then deposits); tapping a group zooms in. Marks stay single.
  const pri = (f) => f.kind.startsWith("hotspot") ? (f.class ? 3 : 2) : 1;
  const groups = [];
  for (const f of [...finds.finds].sort((a, b) => pri(b) - pri(a))) {
    const kind = findKind(f.kind), p = findPos(f);
    if (!p || hiddenKinds.has(kind) || kind === "mark") continue;
    const gp = groups.find(q => Math.hypot(q.p[0] - p[0], q.p[1] - p[1]) / k < 26);
    if (gp) gp.members.push(p); else groups.push({ p, seed: f, members: [p] });
  }
  const groupOf = new Map(groups.map(gp => [gp.seed, gp]));
  for (const f of finds.finds) {
    const kind = findKind(f.kind), p = findPos(f);
    if (!p || hiddenKinds.has(kind)) continue;
    const c = css(KIND[kind].colour);
    const gp = groupOf.get(f), member = kind !== "mark" && !gp;
    if (member) {                     // drawn as part of a group: keep only a hotspot's reach ring
      if (kind !== "deposit-find") el("circle", { cx: p[0], cy: -p[1], r: reach(f), fill: "none", stroke: c, "stroke-width": 1.5 * k,
        "stroke-dasharray": `${6 * k} ${5 * k}`, opacity: 0.35 }, g);
      continue;
    }
    if (kind === "mark" && ICONS) {
      icon(g, p[0], p[1], "custommarker", 26);
      const t = el("text", { x: p[0] + 16 * k, y: -p[1] + 4 * k, "font-size": 12 * k, fill: css("--ink-1"), stroke: css("--page"),
        "stroke-width": 3 * k, "paint-order": "stroke", "data-x": p[0], "data-y": p[1], "data-pri": 5 }, g);
      t.textContent = f.name;
      const hitm = el("circle", { cx: p[0], cy: -p[1], r: 15 * k, fill: "transparent", cursor: "pointer" }, hits);
      hitm.addEventListener("click", (ev) => { ev.stopPropagation(); showFind(f, p); });
      continue;
    }
    if (kind === "mark") {             // a flag on a pole, with its name (/mark in game chat)
      el("path", { d: `M ${p[0]} ${-p[1]} v ${-16 * k} l ${10 * k} ${4 * k} l ${-10 * k} ${4 * k}`, fill: css("--ink-1"),
        stroke: css("--page"), "stroke-width": 1.5 * k, "stroke-linejoin": "round" }, g);
      const t = el("text", { x: p[0] + 12 * k, y: -p[1] - 8 * k, "font-size": 12 * k, fill: css("--ink-1"), stroke: css("--page"),
        "stroke-width": 3 * k, "paint-order": "stroke", "data-x": p[0], "data-y": p[1], "data-pri": 5 }, g);
      t.textContent = f.name;
      const hitm = el("circle", { cx: p[0], cy: -p[1] - 8 * k, r: 14 * k, fill: "transparent", cursor: "pointer" }, hits);
      hitm.addEventListener("click", (ev) => { ev.stopPropagation(); showFind(f, p); });
      continue;
    }
    if (kind !== "deposit-find")      // the area an extractor must be inside to draw from the hotspot
      el("circle", { cx: p[0], cy: -p[1], r: reach(f), fill: "none", stroke: c, "stroke-width": 1.5 * k,
        "stroke-dasharray": `${6 * k} ${5 * k}`, opacity: 0.55 }, g);
    const ic = iconOf(kind, f.class);
    if (ic) icon(g, p[0], p[1], ic, kind === "deposit-find" ? 20 : 30);
    else {
      const s = (kind === "deposit-find" ? 5 : 8) * k;
      el("path", { d: kind === "deposit-find" ? `M ${p[0] - s} ${-p[1] - s} h ${2 * s} v ${2 * s} h ${-2 * s} Z`
          : `M ${p[0]} ${-p[1] - s * 1.3} L ${p[0] + s} ${-p[1]} L ${p[0]} ${-p[1] + s * 1.3} L ${p[0] - s} ${-p[1]} Z`,
        fill: c, stroke: css("--page"), "stroke-width": 1.5 * k }, g);
    }
    if (gp && gp.members.length > 1) {    // count badge; tap to zoom to the group
      const n = gp.members.length, bx = p[0] + 11 * k, by = -p[1] - 11 * k;
      el("circle", { cx: bx, cy: by, r: 8.5 * k, fill: css("--ink-1"), stroke: css("--page"), "stroke-width": 1.5 * k }, g);
      const t = el("text", { x: bx, y: by + 3.8 * k, "font-size": 10.5 * k, "font-weight": 700, "text-anchor": "middle", fill: css("--page") }, g);
      t.textContent = n;
      const xs = gp.members.map(m => m[0]), ys = gp.members.map(m => m[1]);
      const hitg = el("circle", { cx: p[0], cy: -p[1], r: 16 * k, fill: "transparent", cursor: "zoom-in" }, hits);
      hitg.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), 40);
        if (follow) setFollow(0);
        zoomTo((Math.max(...xs) + Math.min(...xs)) / 2, (Math.max(...ys) + Math.min(...ys)) / 2, span * 4);
      });
      hitg.addEventListener("pointerenter", (ev) => { if (ev.pointerType === "mouse") tip(`${n} finds here · tap to zoom in`, ev); });
      hitg.addEventListener("pointerleave", () => { $("tip").hidden = true; });
      continue;
    }
    if (kind !== "deposit-find") {
      // class and resource beside the diamond; data-x/y let facing-up mode keep it upright
      const res = f.options && f.basis !== "recorded by you from the visor" ? "?" : (f.resource || "?");
      const t = el("text", { x: p[0] + (ic ? 17 : 11) * k, y: -p[1] + 4 * k, "font-size": 12 * k, fill: css(f.class ? "--ink-1" : "--ink-2"),
        stroke: css("--page"), "stroke-width": 3 * k, "paint-order": "stroke", "stroke-linejoin": "round",
        "data-x": p[0], "data-y": p[1], "data-pri": 3 }, g);
      // with icons the class letter is in the icon itself
      const cls = ic ? "" : `${f.class || "?"} `;
      t.textContent = `${cls}${kind === "hotspot-power" ? `${f.class ? f.rates[f.class] + " kP" : "power"}` : res}`;
    }
    const hit = el("circle", { cx: p[0], cy: -p[1], r: 14 * k, fill: "transparent", cursor: "pointer" }, hits);
    hit.addEventListener("click", (ev) => { ev.stopPropagation(); showFind(f, p); });
    hit.addEventListener("pointerenter", (ev) => { if (ev.pointerType === "mouse") tip(findTitle(f), ev); });
    hit.addEventListener("pointerleave", () => { $("tip").hidden = true; });
  }
  declutter();      // the finds arrive after the rest of the map
  if (globeOn) drawGlobe();
}

function showFind(f, p) {
  const P = $("panel");
  selected = p || null; drawSel();
  const rows = [`<b>${findTitle(f)}</b>`];
  if (f.kind.startsWith("hotspot")) {
    if (f.kind !== "hotspot-power") {
      rows.push(f.resource ? `Resource: <b>${f.resource}</b>` : "Resource: not known yet");
      if (f.basis) rows.push(`<span style="color:var(--ink-muted)">${f.basis}</span>`);
      const opts = f.options || [];
      if (opts.length > 1) rows.push(opts.map(o => `<button class="${f.resource === o ? "on" : ""}" onclick='setFindLabel(${JSON.stringify(f.key)}, "resource", ${JSON.stringify(f.resource === o ? null : o)})'>${o}</button>`).join(" "));
    }
    const unit = f.rate_unit, rates = ["C", "B", "A", "S"].map(c => f.rates[c]).join("/");
    rows.push(f.class ? `Class <b>${f.class}</b> · ${f.rates[f.class]} ${unit}${f.class_source === "you" ? " <span style='color:var(--ink-muted)'>(set by you)</span>" : ""}`
      : `Class: set it from the visor (C/B/A/S give ${rates} ${unit})`);
    rows.push(["C", "B", "A", "S"].map(c => `<button class="${f.class === c ? "on" : ""}" onclick='setFindLabel(${JSON.stringify(f.key)}, "class", ${JSON.stringify(f.class === c ? null : c)})'>${c}</button>`).join(" "));
    const r = ((finds.ranges || {})[f.kind] || finds.range_m || [190]);
    rows.push(`${f.kind === "hotspot-power" ? "Electromagnetic generators" : "Extractors"} must be within ${r[0]}–${r[1] || r[0]} m (the game's hotspot range)`);
  }
  if (f.e !== undefined) rows.push(`${fmtDist(Math.hypot(f.e, f.n))} ${compass(bearing(f.e, f.n))} of the base computer`);
  rows.push(`First seen ${new Date(f.first * 1000).toLocaleString()}`);
  rows.push(`<button onclick='setTarget(${JSON.stringify("w:" + f.w.join(","))}, ${JSON.stringify(findTitle(f)).replace(/'/g, "&#39;")})'>Go to</button>`);
  P.innerHTML = `<button class="close" onclick="closePanel()">×</button>` + rows.join("<br>");
  P.style.display = "block";
}

async function setFindLabel(key, field, value) {
  const r = await fetch("/api/finds/class", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key, [field]: value }) });
  if (r.status === 503) { dbCheck(await r.json()); return; }
  await loadFinds();
  const f = finds && finds.finds.find(x => x.key === key);
  if (f) showFind(f, findPos(f));
}
window.setFindLabel = setFindLabel;

function legendFinds() {
  const L = $("legend");
  L.querySelectorAll(".findchip").forEach(e => e.remove());
  if (!finds || !finds.finds.length) return;
  const kinds = [...new Set(finds.finds.map(f => findKind(f.kind)))];
  const hl = L.querySelector(".hlegend");
  for (const k of kinds) {
    const b = document.createElement("button");
    b.className = `chip findchip${hiddenKinds.has(k) ? " off" : ""}`;
    const ic = iconOf(k);
    b.innerHTML = (ic ? `<img src="/icon/${ic}.png" width="16" height="16" style="vertical-align:-3px;margin-right:4px">`
      : `<i style="border-radius:${k === "deposit-find" ? "1px" : "1px;transform:rotate(45deg) scale(.85)"};background:${css(KIND[k].colour)}"></i>`) + KIND[k].label;
    b.onclick = () => toggleKind(k);
    L.insertBefore(b, hl);
  }
}

// ---- nms-db: the map's history (trail, finds, sectors, systems) is in Postgres; say so when it can't be reached ----
let dbDown = null;
function dbCheck(got) {          // got from an /api/* call: returns it, or null when nms-db is down
  const down = got && got.db === false ? got.error || "nms-db unreachable" : null;
  if (down !== dbDown) {
    dbDown = down;
    const D = $("dbdown");
    D.hidden = !down;
    D.innerHTML = down ? `<span class="pill critical">⚠ Database down</span>History, finds and sectors can't load: ${down}` : "";
  }
  return down ? null : got;
}

// ---- sectors (/api/sectors, nmsexporter/sectors.py): the planet in 8 octants x 4, and the cells your trail has charted ----
let sect = null, sectTimer = null;
async function loadSectors() {
  clearTimeout(sectTimer);
  if (!planet) return;
  const want = planet.address;
  try {
    const got = dbCheck(await (await fetch("/api/sectors?" + new URLSearchParams({ address: planet.address }), { cache: "no-store" })).json());
    if (got && planet && want === planet.address) { sect = got; drawSectors(); if (globeOn) drawGlobe(); if (!$("sheet").hidden) drawSheet(); }
  } catch (e) { /* the layer just stays empty */ }
  sectTimer = setTimeout(loadSectors, onThisPlanet() ? 20000 : 120000);
}
const det3 = (a, b, c) => vdot(a, vcross(b, c));
function inTri(t, u) {
  const s = det3(...t) > 0 ? 1 : -1;
  return Math.min(s * det3(t[0], t[1], u), s * det3(t[1], t[2], u), s * det3(t[2], t[0], u));
}
function sectorOf(w) {        // the sector a planet-frame position is in, or null
  if (!sect || !sect.sectors || !sect.sectors.length || !w) return null;
  const u = vnorm(w);
  let best = null, m = -Infinity;
  for (const s of sect.sectors) { const v = inTri(s.corners, u); if (v > m) { m = v; best = s; } }
  return best;
}
const km2 = (cells) => cells * (sect.cell_km ** 2) * Math.sqrt(3) / 4;
const fmtArea = (a) => a >= 100 ? `${Math.round(a)} km²` : a >= 1 ? `${a.toFixed(1)} km²` : `${Math.round(a * 1e6).toLocaleString()} m²`;
const fmtPct = (p) => p === 0 ? "0%" : p < 0.01 ? "<0.01%" : p < 1 ? `${p.toFixed(2)}%` : `${p.toFixed(1)}%`;

function drawSectors() {      // flat planet view: charted cells, then sector edges and names
  const g = $("sect");
  if (!g) return;
  g.innerHTML = "";
  if (base || !shown.sectors || !sect || sect.error || !sect.sectors) return;
  for (const c of sect.cells) if (c.xy)
    el("polygon", { points: c.xy.map(([x, y]) => `${x},${-y}`).join(" "), fill: css("--ink-2"), "fill-opacity": 0.16,
      stroke: css("--ink-2"), "stroke-opacity": 0.35, "data-w": 0.6 }, g);
  const here = sect.you;
  for (const s of sect.sectors) {
    if (!s.edge_xy) continue;
    let d = "", pen = false;
    for (const p of s.edge_xy) { if (!p) { pen = false; continue; } d += `${pen ? "L" : "M"}${p[0]},${-p[1]}`; pen = true; }
    if (d) el("path", { d, fill: "none", stroke: css("--ink-muted"), "stroke-opacity": 0.7, "data-w": 1.2, "data-dash": "3 3" }, g);
    if (s.centre_xy) label(g, s.centre_xy[0], s.centre_xy[1], `${s.id}${s.id === here ? " · you" : ""}${s.charted ? ` · ${fmtPct(s.pct)}` : ""}`, "--ink-muted", 13, 1);
  }
  rescale();
}

function globeSectors(ctx, toScreen) {
  if (!shown.sectors || !sect || sect.error || !sect.sectors) return;
  const arc = (a, b, n = 24) => { const out = []; for (let k = 0; k <= n; k++) out.push(vnorm(a.map((x, i) => x * (n - k) / n + b[i] * k / n))); return out; };
  ctx.fillStyle = css("--ink-2"); ctx.globalAlpha = 0.35;
  for (const c of sect.cells) {
    const p = c.corners.map(toScreen);
    if (p.some(q => q[2] <= 0)) continue;
    ctx.beginPath(); p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill();
    if (Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]) < 3) { ctx.beginPath(); ctx.arc(p[0][0], p[0][1], 2, 0, 2 * Math.PI); ctx.fill(); }   // too small to see: a dot
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = css("--ink-muted"); ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  for (const s of sect.sectors) {
    const c = s.corners;
    for (const [a, b] of [[c[0], c[1]], [c[1], c[2]], [c[2], c[0]]]) {
      ctx.beginPath(); let on = false;
      for (const u of arc(a, b)) { const [x, y, d] = toScreen(u); if (d > 0) { on ? ctx.lineTo(x, y) : ctx.moveTo(x, y); on = true; } else on = false; }
      ctx.stroke();
    }
  }
  ctx.setLineDash([]);
  ctx.font = "12px system-ui, sans-serif"; ctx.textAlign = "center";
  for (const s of sect.sectors) {
    const [x, y, d] = toScreen(s.centre);
    if (d < 0.25) continue;
    const t = s.charted ? `${s.id} ${fmtPct(s.pct)}` : s.id;
    ctx.strokeStyle = css("--page"); ctx.lineWidth = 3; ctx.strokeText(t, x, y);
    ctx.fillStyle = css(s.id === sect.you ? "--ink-1" : "--ink-muted"); ctx.fillText(t, x, y);
  }
  ctx.textAlign = "start";
}

// ---- Places / Sectors sheet ----
let sheetTab = "places", placeSort = "dist", placeKind = "", placeSector = "";
const CLASS_RANK = { S: 0, A: 1, B: 2, C: 3 };
function places() {
  const out = [];
  for (const p of planet.points) {
    if (!p.w) continue;
    out.push({ kind: p.kind, title: p.kind === "base" ? p.name : p.name || (KIND[p.kind] || {}).label, sub: (KIND[p.kind] || {}).label,
      w: p.w, x: p.x, y: p.y, key: p.kind === "base" ? `b:${p.name}` : `w:${p.w.join(",")}`, open: () => show(p) });
  }
  if (finds) for (const f of finds.finds) {
    const k = findKind(f.kind);
    out.push({ kind: k, title: findTitle(f), sub: KIND[k].label + (f.kind.startsWith("hotspot") && !f.class ? " · class not set" : ""),
      cls: f.class, w: f.w, x: f.x, y: f.y, key: `w:${f.w.join(",")}`, open: () => showFind(f, base ? null : [f.x, f.y]) });
  }
  const meW = onThisPlanet() ? live.player.w : null;
  for (const q of out) {
    const s = sectorOf(q.w);
    q.sector = s ? s.id : "";
    if (meW) {
      const a = vnorm(q.w), b = vnorm(meW);
      q.dist = Math.acos(Math.max(-1, Math.min(1, vdot(a, b)))) * planet.radius;
      const [n, e] = (() => { const d = b[1], nn = vnorm([-d * b[0], 1 - d * b[1], -d * b[2]]); return [nn, vnorm(vcross(nn, b))]; })();
      q.brg = bearing(vdot(a, e), vdot(a, n));
    } else { q.dist = Math.hypot(q.x, q.y); q.brg = bearing(q.x, q.y); }
  }
  return { list: out, fromYou: !!meW };
}
function drawSheet() {
  const C = $("sheetctl"), B = $("sheetbody");
  $("tabplaces").classList.toggle("on", sheetTab === "places"); $("tabsectors").classList.toggle("on", sheetTab === "sectors");
  if (!planet) { B.innerHTML = ""; return; }
  if (sheetTab === "places") {
    const { list, fromYou } = places();
    const kinds = [...new Set(list.map(q => q.kind))];
    const secs = [...new Set(list.map(q => q.sector).filter(Boolean))].sort();
    if (placeKind && !kinds.includes(placeKind)) placeKind = "";
    if (placeSector && !secs.includes(placeSector)) placeSector = "";
    C.innerHTML = `<select id="psort" aria-label="Sort by">${[["dist", fromYou ? "Nearest you" : "Nearest the map centre"], ["kind", "Type"], ["class", "Class (S first)"], ["name", "Name"], ["sector", "Sector"]]
      .map(([v, l]) => `<option value="${v}"${placeSort === v ? " selected" : ""}>${l}</option>`).join("")}</select>`
      + `<select id="pkind" aria-label="Type"><option value="">All types</option>${kinds.map(k => `<option value="${k}"${placeKind === k ? " selected" : ""}>${(KIND[k] || {}).label || k}</option>`).join("")}</select>`
      + (secs.length > 1 ? `<select id="psector" aria-label="Sector"><option value="">All sectors</option>${secs.map(k => `<option${placeSector === k ? " selected" : ""}>${k}</option>`).join("")}</select>` : "");
    let rows = list.filter(q => (!placeKind || q.kind === placeKind) && (!placeSector || q.sector === placeSector));
    const by = { dist: (a, b) => a.dist - b.dist, name: (a, b) => a.title.localeCompare(b.title),
      kind: (a, b) => ((KIND[a.kind] || {}).label || "").localeCompare((KIND[b.kind] || {}).label || "") || a.dist - b.dist,
      class: (a, b) => (CLASS_RANK[a.cls] ?? 9) - (CLASS_RANK[b.cls] ?? 9) || a.dist - b.dist,
      sector: (a, b) => a.sector.localeCompare(b.sector) || a.dist - b.dist }[placeSort];
    rows.sort(by);
    C.insertAdjacentHTML("beforeend", `<span class="count">${rows.length} of ${list.length}</span>`);
    B.innerHTML = rows.length ? rows.map((q, i) => {
      const ic = iconOf(q.kind, q.cls);
      const mk = ic ? `<img class="mk" src="/icon/${ic}.png" alt="">` : `<span class="mk"><i style="background:${css((KIND[q.kind] || KIND.structure).colour)}"></i></span>`;
      return `<div class="prow${target && target.key === q.key ? " on" : ""}" data-i="${i}">${mk}<span><b>${q.title}</b><small>${q.sub}${q.sector ? ` · ${q.sector}` : ""}</small></span>`
        + `<span class="d">${fmtDist(q.dist)}<small>${compass(q.brg)}</small></span><button data-go="${i}" title="Navigate here (arrow and distance in the Nearby card)">Go</button></div>`;
    }).join("") : `<div class="empty">Nothing recorded on this planet yet.</div>`;
    $("psort").onchange = (e) => { placeSort = e.target.value; drawSheet(); };
    $("pkind").onchange = (e) => { placeKind = e.target.value; drawSheet(); };

// ---- ground heights (/api/elevation): lowest sample per cell, metres above sea level ----
let elev = null, showHeights = true, elevTimer = null;
const SEQ = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(i => `--seq-${i}`);

async function loadElevation() {

// ---- terrain surface: the height samples interpolated (inverse-distance weighting) into a raster,
// coloured by height, hill-shaded from the north-west, with contour lines (marching squares).
// Only ground near a sample is drawn, fading out at its edge: where you have never been stays dark.
let terrain = null;      // {x0, y1, res, W, H, z: Float32Array (NaN = unknown)} in map units, for hover readout
const hexRgb = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function heightRgb(h) {

    const top = Math.max(Math.abs(elev.min), Math.abs(elev.max), 2), t = Math.min(1, Math.abs(h) / top);
    const mid = hexRgb(css("--div-mid")), end = hexRgb(css(h < 0 ? "--div-below" : "--div-above"));
    return mid.map((m, i) => m + (end[i] - m) * Math.sqrt(t));

  const ramp = SEQ.map(v => hexRgb(css(v)));
  const t = Math.max(0, Math.min(1, (h - elev.min) / Math.max(elev.max - elev.min, 1))) * (ramp.length - 1);
  const i = Math.min(ramp.length - 2, Math.floor(t)), f = t - i;

}

function buildTerrain() {
  const c = elev.cell, res = c / 2, R = 3.5 * c, near = 1.2 * c;
  const pts = new Map();
  let i0 = Infinity, i1 = -Infinity, j0 = Infinity, j1 = -Infinity;
  for (const [i, j, h] of elev.cells) {
    pts.set(`${i},${j}`, h);

  }
  const M = 4, x0 = (i0 - M) * c, y0 = (j0 - M) * c;

  const z = new Float32Array(W * H).fill(NaN), a = new Float32Array(W * H);
  for (let py = 0; py < H; py++) for (let qx = 0; qx < W; qx++) {
    const x = x0 + (qx + 0.5) * res, y = y0 + (H - py - 0.5) * res;       // row 0 is the north edge
    const ci = Math.floor(x / c), cj = Math.floor(y / c);
    let ws = 0, zs = 0, dmin = Infinity;
    for (let di = -4; di <= 4; di++) for (let dj = -4; dj <= 4; dj++) {
      const h = pts.get(`${ci + di},${cj + dj}`);
      if (h === undefined) continue;
      const d = Math.hypot(x - (ci + di + 0.5) * c, y - (cj + dj + 0.5) * c);
      if (d > R) continue;
      dmin = Math.min(dmin, d);
      const w = 1 / Math.max(d * d, 1);
      ws += w; zs += w * h;

    if (!ws) continue;
    z[py * W + qx] = zs / ws;
    a[py * W + qx] = dmin <= near ? 1 : Math.max(0, 1 - (dmin - near) / (R - near));

}

function drawElevation() {
  const g = $("elev");
  if (!g) return;
  g.innerHTML = "";
  terrain = null;
  if (!showHeights || !elev || !elev.cells.length) return;
  const T = terrain = buildTerrain(), { W, H, z, a, res } = T;
  // colour x hillshade (sun from the north-west, 45 degrees up), exaggerated so gentle ground still reads
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(W, H);

  const at = (qx, py) => { const v = z[Math.max(0, Math.min(H - 1, py)) * W + Math.max(0, Math.min(W - 1, qx))]; return v; };
  for (let py = 0; py < H; py++) for (let qx = 0; qx < W; qx++) {
    const k = py * W + qx, h = z[k];
    if (Number.isNaN(h)) continue;
    const e = (at(qx + 1, py) - at(qx - 1, py)), n = (at(qx, py - 1) - at(qx, py + 1));   // per 2 px
    const dzdx = (Number.isNaN(e) ? 0 : e) * ex / (2 * res), dzdy = (Number.isNaN(n) ? 0 : n) * ex / (2 * res);
    const len = Math.hypot(dzdx, dzdy, 1), shade = Math.max(0, (-dzdx * sun[0] - dzdy * sun[1] + sun[2]) / len);
    const rgb = heightRgb(h), lit = 0.45 + 0.75 * shade;

    img.data[4 * k + 2] = Math.min(255, rgb[2] * lit); img.data[4 * k + 3] = 235 * a[k];

  const u = up.getContext("2d");
  u.imageSmoothingEnabled = true; u.imageSmoothingQuality = "high"; u.filter = "blur(2px)";
  u.drawImage(cv, 0, 0, up.width, up.height);

  drawContours(g, T);
}

// Marching squares over the raster; every fifth level is an index contour.
function drawContours(g, T) {
  const { W, H, z, a, res, x0, y1 } = T, span = elev.max - elev.min;
  if (span < 4) return;
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 200].find(s => span / s <= 12) || 500;
  const ref = elev.water ? 0 : 0;
  const X = (qx) => x0 + (qx + 0.5) * res, Y = (py) => -(y1 - (py + 0.5) * res);   // svg y is -north
  const minor = [], major = [];
  for (let lv = Math.ceil((elev.min - ref) / step) * step + ref; lv <= elev.max; lv += step) {
    const out = Math.round((lv - ref) / step) % 5 === 0 ? major : minor;
    for (let py = 0; py < H - 1; py++) for (let qx = 0; qx < W - 1; qx++) {
      const k = py * W + qx, v = [z[k], z[k + 1], z[k + W + 1], z[k + W]];
      if (v.some(Number.isNaN) || Math.min(a[k], a[k + 1], a[k + W], a[k + W + 1]) < 0.5) continue;
      const idx = (v[0] > lv) | (v[1] > lv) << 1 | (v[2] > lv) << 2 | (v[3] > lv) << 3;
      if (idx === 0 || idx === 15) continue;
      const lerp = (p, q, vp, vq) => [p[0] + (q[0] - p[0]) * (lv - vp) / (vq - vp), p[1] + (q[1] - p[1]) * (lv - vp) / (vq - vp)];
      const c0 = [X(qx), Y(py)], c1 = [X(qx + 1), Y(py)], c2 = [X(qx + 1), Y(py + 1)], c3 = [X(qx), Y(py + 1)];

      const segs = { 1: [[3, 0]], 2: [[0, 1]], 3: [[3, 1]], 4: [[1, 2]], 5: [[3, 0], [1, 2]], 6: [[0, 2]], 7: [[3, 2]],
        8: [[2, 3]], 9: [[0, 2]], 10: [[0, 1], [2, 3]], 11: [[1, 2]], 12: [[1, 3]], 13: [[0, 1]], 14: [[0, 3]] }[idx];
      for (const [p, q] of segs) out.push(`M${e[p][0].toFixed(1)} ${e[p][1].toFixed(1)}L${e[q][0].toFixed(1)} ${e[q][1].toFixed(1)}`);
    }
  }

  if (major.length) el("path", { d: major.join(""), fill: "none", stroke: css("--ink-1"), "stroke-opacity": 0.38, "data-w": 1.3, "stroke-width": 1.3 * k }, g);

}

// height under the mouse, from the terrain raster
function heightAt(mx, my) {
  const T = terrain;
  if (!T) return null;
  const qx = Math.floor((mx - T.x0) / T.res), py = Math.floor((T.y1 - my) / T.res);
  if (qx < 0 || py < 0 || qx >= T.W || py >= T.H) return null;

function heightColour(h) {

    const top = Math.max(Math.abs(elev.min), Math.abs(elev.max), 2);
    const step = Math.min(3, Math.floor(Math.abs(h) / top * 4));

  }

const heightText = (h) => elev.water

// ---- globe: the planet as an orthographic globe, for bases far apart where the flat map stretches ----
let globeOn = false, gc = null, gzoom = 1;

const imgOf = (name) => {

function drawGlobe() {
