-- No Man's Sky - traveller. The left portrait screen: where you are, money,
-- vitals, the frigate fleet, missions in progress and lifetime counters.
--
--   conky -c conky/left.conf
--
-- Data is the exporter's /json on loopback (NMS_CONKY_URL to override). The
-- leftmost monitor is used unless NMS_CONKY_OUTPUT names one.
local here = debug.getinfo(1, 'S').source:sub(2):match('(.*/)') or './'
local common = dofile(here .. 'common.lua')
local R = 'CONKY_DPI_SCALE=' .. common.scale() .. ' python3 ' .. here .. 'nms_conky.py left '

conky.config = common.config({
  xinerama_head = common.head('left'),
  own_window_class = 'nms-conky-left',
  own_window_title = "No Man's Sky - traveller",
})

conky.text = common.unscale(table.concat({
  '${execpi 5 ' .. R .. 'head}',
  '${voffset 10}${execpi 5 ' .. R .. 'where}',
  '${voffset 24}${execpi 5 ' .. R .. 'money}',
  '${voffset 24}${execpi 5 ' .. R .. 'vitals}',
  '${voffset 24}${execpi 5 ' .. R .. 'travel}',
  '${voffset 24}${execpi 5 ' .. R .. 'fleet}',
  '${voffset 24}${execpi 5 ' .. R .. 'missions}',
  '${voffset 24}${execpi 5 ' .. R .. 'tech}',
  '${voffset 24}${execpi 5 ' .. R .. 'collection}',
  '${voffset 24}${execpi 5 ' .. R .. 'lifetime}',
}, '\n'))
