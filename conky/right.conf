-- No Man's Sky - bases. The right portrait screen: refiners, extraction
-- farms, plants, missions and what is in the inventory, all projected forward from the
-- save so timers keep counting between autosaves. Which panels show, and in
-- what order, follows the activity set from the phone (idle: inventory first;
-- gathering: farms and plants; crafting: the refinery board; mission: the
-- mission the phone or the game picked, every stage, then the rest in
-- progress, with refiners, farms and plants hidden); each slot below
-- is the Nth panel of that activity's list (LAYOUT in nms_conky.py). The
-- crafting and tidy sections still render (nms_conky.py right crafting|tidy)
-- but are left off the screen so the inventory search stays in view.
--
--   conky -c conky/right.conf
--
-- Data is the exporter's /json on loopback (NMS_CONKY_URL to override). The
-- rightmost monitor is used unless NMS_CONKY_OUTPUT names one.
local here = debug.getinfo(1, 'S').source:sub(2):match('(.*/)') or './'
local common = dofile(here .. 'common.lua')
local R = 'CONKY_DPI_SCALE=' .. common.scale() .. ' python3 ' .. here .. 'nms_conky.py right '

-- Click the screen to search the inventory, right-click to clear. conky's own
-- mouse hook misses clicks (see nms_search.py), so a small watcher started
-- here handles them, and exits when this conky does.
os.execute('python3 ' .. here .. 'nms_search.py --watch >/dev/null 2>&1 &')

conky.config = common.config({
  xinerama_head = common.head('right'),
  own_window_class = 'nms-conky-right',
  own_window_title = "No Man's Sky - bases",
})

conky.text = common.unscale(table.concat({
  '${execpi 5 ' .. R .. 'head}',
  '${voffset 10}${execpi 2 ' .. R .. 'slot1}',  -- quick to follow a mode change or a search
  '${execpi 2 ' .. R .. 'slot2}',
  '${execpi 2 ' .. R .. 'slot3}',
  '${execpi 2 ' .. R .. 'slot4}',
  '${execpi 2 ' .. R .. 'slot5}',
  '${execpi 2 ' .. R .. 'slot6}',
}, '\n'))
